name: Deploy Examples to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root & client dependencies
        run: |
          npm install
          (cd examples/vue-client && npm install)
          (cd examples/react-client && npm install)

      - name: Build Vue & React Client Standalone Dist
        run: |
          (cd examples/vue-client && npm run build)
          (cd examples/react-client && npm run build)

      - name: Prepare GitHub Pages Site Directory
        run: |
          mkdir -p _site
          # 1. 既存の WebUI トップページを含む全ルートアセットをコピー
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          # 2. Vue & React クライアントの dist を指定サブフォルダへ確実に配備
          mkdir -p _site/examples/vue-client
          cp -r examples/vue-client/dist _site/examples/vue-client/
          mkdir -p _site/examples/react-client
          cp -r examples/react-client/dist _site/examples/react-client/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
