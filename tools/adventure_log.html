<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetHack - 冒険手帳 (Adventure Log)</title>
    <!-- タイルマッピングのロード (knowledge-inspector.html と共通) -->
    <script src="../param/tileMapping.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/portal-theme.css">
    <script type="module" src="../src/components/portal/NhPortalNav.js"></script>

    <style>
        :root {
            --accent-color: #38bdf8;
            --accent-hover: #7dd3fc;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --shadow: var(--shadow-md);
        }

        body {
            min-height: 100vh;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            animation: fadeIn 0.4s ease-out;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .nav-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--accent-hover);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 960px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .card-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: var(--glass-blur);
            padding: 20px;
            min-height: 480px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .card-panel::-webkit-scrollbar {
            width: 6px;
        }
        .card-panel::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }

        .detail-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 480px;
            color: var(--text-secondary);
            text-align: center;
            gap: 14px;
            padding: 20px;
            border: 2px dashed rgba(148, 163, 184, 0.2);
            border-radius: 12px;
        }

        .detail-placeholder .icon {
            font-size: 48px;
            opacity: 0.6;
        }

        .detail-placeholder p {
            font-size: 14px;
            line-height: 1.6;
            max-width: 280px;
        }

        nh-codex-grid {
            width: 100%;
            height: 100%;
        }

        nh-knowledge-card {
            width: 100%;
        }
    </style>
</head>

<body>
    <style>
        /* 開発者モード (?dev=1) 以外では、ネタバレ・内部ツール系リンクを隠す */
        body:not(.dev-mode) .dev-only { display: none !important; }
    </style>
    <script>
        if (new URLSearchParams(window.location.search).get('dev') === '1') {
            document.body.classList.add('dev-mode');
        }
    </script>
    <div class="container">
        <nh-portal-nav group="user" active="adventure_log"></nh-portal-nav>

        <div class="main-layout">
            <!-- 左ペイン: 冒険手帳グリッド -->
            <div>
                <nh-codex-grid id="codex-grid"></nh-codex-grid>
            </div>

            <!-- 右ペイン: 選択中エントリの3層ナレッジカード -->
            <div class="card-panel">
                <div id="detail-container">
                    <div class="detail-placeholder" id="txt-detail-placeholder">
                        <span class="icon">📖</span>
                        <h3 id="txt-placeholder-title" style="color: #f8fafc; font-size: 1.1rem;">3層統合ナレッジ</h3>
                        <p id="txt-placeholder-desc">左のタイルをクリックすると、スペック・公式解説・噂の豆知識がここに表示されます。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ES Module Script -->
    <script type="module">
        import { NhCodexGrid } from '../src/components/NhCodexGrid.js';
        import { NhKnowledgeCard } from '../src/components/NhKnowledgeCard.js';
        import { AdventureLogManager } from '../src/core/knowledge/lore/AdventureLogManager.js';
        import { MONSTER_KNOWLEDGE_MAP } from '../src/core/knowledge/data/MONSTER_KNOWLEDGE_FULL.js';
        import { OBJECT_KNOWLEDGE_MAP } from '../src/core/knowledge/data/OBJECT_KNOWLEDGE_FULL.js';
        import { PortalState } from '../src/core/portal/PortalState.js';

        // 初期化
        const manager = new AdventureLogManager();
        const grid = document.getElementById('codex-grid');
        const detailContainer = document.getElementById('detail-container');
        let currentSelected = null;

        function renderPlaceholder() {
            if (!detailContainer) return;
            const isJp = PortalState.isJapanese();
            const title = isJp ? "3層統合ナレッジ" : "3-Tier Integrated Knowledge";
            const desc = isJp
                ? "左のタイルをクリックすると、スペック・公式解説・噂の豆知識がここに表示されます。"
                : "Click any tile on the left to inspect specifications, official lore, and rumor trivia.";
            detailContainer.innerHTML = `
                <div class="detail-placeholder">
                    <span class="icon">📖</span>
                    <h3 style="color: #f8fafc; font-size: 1.1rem;">${title}</h3>
                    <p>${desc}</p>
                </div>
            `;
        }

        if (grid) {
            grid.setManager(manager);
            grid.setTileImage('../pict/nethack_default_32_tr.png');

            grid.addEventListener('entry-selected', (e) => {
                const { entry, category, data } = e.detail;
                currentSelected = { entry, category, data, options: {} };
                renderDetail(entry, category, data);
            });
        }

        const cardPanel = document.querySelector('.card-panel');

        function renderDetail(entry, category, data, cardOptions = {}) {
            if (!detailContainer) return;
            currentSelected = { entry, category, data, options: cardOptions };
            detailContainer.innerHTML = '';

            // 詳細パネルの内部スクロールを先頭にリセット
            if (cardPanel) {
                cardPanel.scrollTop = 0;
            }

            if (category === 'monster' || category === 'object') {
                const card = document.createElement('nh-knowledge-card');
                card.setTarget(data, {
                    adventureLogManager: manager,
                    currentLanguage: PortalState.getLanguage(),
                    activeTab: cardOptions.activeTab || 'spec',
                    tileImage: '../pict/nethack_default_32_tr.png'
                });

                // カード内の噂クリック時に手帳の噂タブ・該当項目へジャンプ
                card.addEventListener('nh-rumor-selected', (e) => {
                    const { rumorId } = e.detail;
                    if (grid && rumorId) {
                        grid.selectEntryById(rumorId, 'rumor');
                    }
                });

                detailContainer.appendChild(card);
            } else if (category === 'rumor') {
                const isJp = PortalState.isJapanese();
                const isTrue = entry.isTrue !== undefined ? entry.isTrue : (entry.type === 'TRUE');
                const related = (data && Array.isArray(data.relatedEntities)) ? data.relatedEntities : [];

                const rumorTitle = isJp ? `📜 噂話 #${String(entry.index).padStart(3, '0')}` : `📜 Rumor #${String(entry.index).padStart(3, '0')}`;
                const trueLabel = isJp ? '✅ 真実の噂 (TRUE)' : '✅ True Rumor (TRUE)';
                const falseLabel = isJp ? '❌ 偽りの噂 (FALSE)' : '❌ False Rumor (FALSE)';
                const badgeText = isTrue ? trueLabel : falseLabel;
                const transLabel = isJp ? '日本語訳 (TRANSLATION)' : 'Japanese Translation (TRANSLATION)';
                const origLabel = isJp ? '英語原文 (ORIGINAL TEXT)' : 'Original English Text (ORIGINAL TEXT)';
                const relatedLabel = isJp ? '🔗 関連する知識・対象 (クリックでカードを表示)' : '🔗 Related Knowledge & Entities (Click to inspect)';
                const codexText = isJp
                    ? '📜 伝承アーカイブ (Rumor & Lore Codex) で神託・床文字・元ネタ出典を見る ➔'
                    : '📜 View Oracles, Engravings & Lore in Codex Archive ➔';

                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                wrapper.style.gap = '16px';
                wrapper.style.padding = '8px';

                wrapper.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(148,163,184,0.2); padding-bottom: 10px;">
                        <span style="font-weight: 700; font-size: 1.1rem; color: #f8fafc;">${rumorTitle}</span>
                        <span style="font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; ${isTrue ? 'background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4);' : 'background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4);'}">
                            ${badgeText}
                        </span>
                    </div>

                    <div>
                        <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase;">${transLabel}</div>
                        <div style="font-size: 0.95rem; color: #e2e8f0; line-height: 1.6; background: rgba(30,41,59,0.5); padding: 12px; border-radius: 8px; border: 1px solid rgba(148,163,184,0.15);">
                            ${entry.textJa || entry.text}
                        </div>
                    </div>

                    <div>
                        <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase;">${origLabel}</div>
                        <div style="font-size: 0.85rem; color: #cbd5e1; font-family: monospace; background: rgba(15,23,42,0.6); padding: 10px; border-radius: 6px; border: 1px solid rgba(148,163,184,0.1);">
                            "${entry.text}"
                        </div>
                    </div>

                    ${related.length > 0 ? `
                        <div>
                            <div style="font-size: 0.75rem; color: #38bdf8; margin-bottom: 8px; font-weight: 700;">${relatedLabel}</div>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="related-buttons-container">
                            </div>
                        </div>
                    ` : ''}

                    <div class="dev-only" style="margin-top: 10px; padding: 12px; background: rgba(227, 179, 65, 0.1); border: 1px solid rgba(227, 179, 65, 0.3); border-radius: 8px; text-align: center;">
                        <a href="lore_codex.html" style="color: #e3b341; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                            ${codexText}
                        </a>
                    </div>
                `;

                detailContainer.appendChild(wrapper);

                // 関連エンティティボタンのイベントバインド
                if (related.length > 0) {
                    const btnContainer = wrapper.querySelector('#related-buttons-container');
                    related.forEach(rel => {
                        const btn = document.createElement('button');
                        btn.style.background = 'rgba(56, 189, 248, 0.15)';
                        btn.style.color = '#38bdf8';
                        btn.style.border = '1px solid rgba(56, 189, 248, 0.35)';
                        btn.style.padding = '6px 12px';
                        btn.style.borderRadius = '6px';
                        btn.style.cursor = 'pointer';
                        btn.style.fontSize = '0.85rem';
                        btn.style.fontWeight = '600';
                        const relName = isJp ? (rel.nameJa || rel.name) : (rel.name || rel.nameJa);
                        btn.textContent = `🔍 ${relName}`;
                        
                        btn.addEventListener('click', () => {
                            let targetEntity = null;
                            if (rel.type === 'ITEM' && rel.onum !== undefined) {
                                targetEntity = OBJECT_KNOWLEDGE_MAP.get(rel.onum);
                                if (targetEntity) renderDetail({ id: targetEntity.id, name: targetEntity.name }, 'object', targetEntity, { activeTab: 'lore' });
                            } else if (rel.type === 'MONSTER') {
                                targetEntity = MONSTER_KNOWLEDGE_MAP.get((rel.name || '').toLowerCase().trim());
                                if (targetEntity) renderDetail({ id: targetEntity.id, name: targetEntity.name }, 'monster', targetEntity, { activeTab: 'lore' });
                            }
                        });
                        btnContainer.appendChild(btn);
                    });
                }
            }

            // 1カラム（縦並び・モバイル）時のみ詳細パネルへスムーズにスクロール
            const isSingleColumn = window.innerWidth <= 960;
            if (cardPanel && isSingleColumn) {
                cardPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function updateUI() {
            const isJp = PortalState.isJapanese();
            document.title = isJp ? 'NetHack - 冒険手帳 (Adventure Log)' : 'NetHack - Adventure Log';
            if (grid) {
                grid.setLanguage(isJp ? 'ja' : 'en');
            }
            if (currentSelected) {
                renderDetail(currentSelected.entry, currentSelected.category, currentSelected.data, currentSelected.options);
            } else {
                renderPlaceholder();
            }
        }

        window.addEventListener('nh-lang-changed', updateUI);
        updateUI();
    </script>
</body>

</html>
