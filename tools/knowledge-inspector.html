                    color: 'background:rgba(34,197,94,0.2); border:1px solid #22c55e; color:#f8fafc;'
                });
            }
            if (trigger.hasPotion) {
                badges.push({
                    icon: '🧪',
                    label: isJa ? 'ポーション所持' : 'Has potion in inventory',
                    color: 'background:rgba(56,189,248,0.2); border:1px solid #38bdf8; color:#f8fafc;'
                });
            }
            if (trigger.hasLongSword) {
                badges.push({
                    icon: '⚔️',
                    label: isJa ? '長剣(Long Sword)所持' : 'Has Long Sword',
                    color: 'background:rgba(56,189,248,0.2); border:1px solid #38bdf8; color:#f8fafc;'
                });
            }
            if (trigger.isLawfulPlayer) {
                badges.push({
                    icon: '⚖️',
                    label: isJa ? '秩序(Lawful)属性限定' : 'Lawful character only',
                    color: 'background:rgba(168,85,247,0.2); border:1px solid #a855f7; color:#f8fafc;'
                });
            }
            if (trigger.hasUnidentifiedOrPoisonPotion) {
                badges.push({
                    icon: '🧪',
                    label: isJa ? '毒薬または未識別薬所持' : 'Has poisonous/unidentified potion',
                    color: 'background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#f8fafc;'
                });
            }
            if (trigger.hasHazardousContainerOrWand) {
                badges.push({
                    icon: '💥',
                    label: isJa ? '魔法の袋または打消の杖所持' : 'Has magic bag or Wand of Cancellation',
                    color: 'background:rgba(239,68,68,0.3); border:1px solid #ef4444; color:#fff;'
                });
            }
            if (trigger.hasUnidentifiedGemsOrStones) {
                badges.push({
                    icon: '💎',
                    label: isJa ? '未識別の石/宝石所持' : 'Has unidentified gems/stones',
                    color: 'background:rgba(6,182,212,0.2); border:1px solid #06b6d4; color:#f8fafc;'
                });
            }

            return badges;
        }

        // Glyph スタイルヘルパー (全タブのエンティティに対して 100% 確実に Glyph ID を解決)
        function getEntityGlyphId(entity) {
            if (!entity) return -1;

            const idLower = (entity.id || '').toLowerCase();

            // 1. 地形・設備 (TERRAIN) を最優先判定 (アイテムとの誤判定を完全防止)
            const TERRAIN_CMAP_GLYPHS = {
                stairs_down: 3999, stairs_up: 3998, closed_door: 3988, open_door: 3986,
                fountain: 4014, sink: 4013, altar: 4006, grave: 4011, tree: 3991,
                bars: 3990, lava: 4017, water: 4015, ice: 4016, drawbridge: 4019,
                cloud: 4024, air: 4023, trap: 4026, throne: 4012, wall: 3929, floor: 3992
            };
            if (entity.entityType === 'TERRAIN' || TERRAIN_CMAP_GLYPHS[idLower] !== undefined) {
                return TERRAIN_CMAP_GLYPHS[idLower] ?? -1;
            }

            // 2. 種族・職業 (CHARACTER)
            const CHARACTER_MON_OFFSETS = {
                human: 260, dwarf: 44, elf: 265, gnome: 165, orc: 72,
                archeologist: 331, barbarian: 332, caveman: 333, healer: 334,
                knight: 335, monk: 336, priest: 337, ranger: 338, rogue: 339,
                samurai: 340, tourist: 341, valkyrie: 342, wizard: 343
            };
            if (entity.entityType === 'CHARACTER' || CHARACTER_MON_OFFSETS[idLower] !== undefined) {
                const monOff = CHARACTER_MON_OFFSETS[idLower] ?? -1;
                return monOff >= 0 ? (GLYPH_OFFSETS.GLYPH_MON_OFF + monOff) : -1;
            }

            // 3. モンスター (MONSTER)
            if (entity.entityType === 'MONSTER' || entity.dangerLevel !== undefined || entity.threat !== undefined || (entity.monOffset !== undefined && entity.monOffset !== null)) {
                const monOffset = (entity.monOffset !== undefined && entity.monOffset !== null)
                    ? entity.monOffset
                    : (entity.monNum !== undefined ? entity.monNum : 0);
                return GLYPH_OFFSETS.GLYPH_MON_OFF + monOffset;
            }

            // 4. アイテム (ITEM)
            if (entity.entityType === 'ITEM' || entity.onum !== undefined || entity.cost !== undefined || entity.stats !== undefined || entity.sdam !== undefined) {
                const onum = (entity.onum !== undefined && entity.onum !== null)
                    ? entity.onum
                    : (typeof entity.id === 'string' && entity.id.startsWith('item_onum_') ? parseInt(entity.id.replace('item_onum_', ''), 10) : -1);
                if (onum >= 0) {
                    return GLYPH_OFFSETS.GLYPH_OBJ_OFF + onum;
                }
            }

            return -1;
        }

        function getEntityGlyphStyleString(glyphId, displaySize = 24) {
            if (glyphId < 0) return '';
            const styleObj = GlyphHelper.getGlyphStyle(glyphId, {
                tileImage: '../pict/nethack_default_32.png',
                tileSize: 32,
                displaySize: displaySize
            });
            if (!styleObj) return '';
            return Object.entries(styleObj).map(([k, v]) => `${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}: ${v};`).join(' ');
        }

        // 言語切り替え
        btnJp.addEventListener('click', () => {
            currentLang = 'ja';
            translator.setEnabled(true);
            knowledgeEngine.setLanguage('ja');
            knowledgeEngine.clearCache();
            btnJp.classList.add('active');
            btnEn.classList.remove('active');
            searchInput.placeholder = '名前、ID、効果などを検索...';
            setupSubFilterOptions();
            updateTabLabels();
            renderList();
            renderCard();
        });

        btnEn.addEventListener('click', () => {
            currentLang = 'en';
            translator.setEnabled(false);
            knowledgeEngine.setLanguage('en');
            knowledgeEngine.clearCache();
            btnEn.classList.add('active');
            btnJp.classList.remove('active');
            searchInput.placeholder = 'Search name, ID, or effects...';
            setupSubFilterOptions();
            updateTabLabels();
            renderList();
            renderCard();
        });

        searchInput.addEventListener('input', renderList);
        subFilter.addEventListener('change', renderList);
        transFilter.addEventListener('change', renderList);

        // --- 2. リスト描画 ---
        function renderList() {
            const query = searchInput.value.toLowerCase().trim();
            const filterVal = subFilter.value;
            const transFilterVal = transFilter.value;
            const currentList = ENTITIES_BY_TAB[currentTab] || [];

            const filtered = currentList.filter(e => {
                // サブフィルター
                if (filterVal !== 'ALL') {
                    if (currentTab === 'MONSTER' && e.dangerLevel !== filterVal) return false;
                    if (currentTab === 'ITEM' && e.category !== filterVal) return false;
                    if (currentTab === 'CLASS' && e.danger !== filterVal) return false;
                    if (currentTab === 'ARTIFACT') {
                        if (filterVal === 'QUEST' && !e.isQuestArtifact) return false;
                        else if (filterVal !== 'QUEST' && e.category !== filterVal && e.alignment !== filterVal) return false;
                    }
                    if (currentTab === 'CHARACTER' && e.subType !== filterVal) return false;
                    if (currentTab === 'TERRAIN' && e.category !== filterVal) return false;
                    if (currentTab === 'CHEMISTRY' && (e.action?.risk !== filterVal && (e.action?.risk || 'INFO') !== filterVal)) return false;
                    if (currentTab === 'ADVICE' && e.severity !== filterVal) return false;
                    if (currentTab === 'SIGNAL' && e.stance !== filterVal) return false;
                }

                // 翻訳検証フィルター (MONSTER / ITEM)
                if ((currentTab === 'MONSTER' || currentTab === 'ITEM') && transFilterVal !== 'ALL') {
                    const comp = getTranslationComparison(e);
                    if (comp && comp.status !== transFilterVal) return false;
                }

                // 検索クエリ
                if (query) {
                    const idStr = (e.id || '').toLowerCase();
                    const nameStr = (e.name || e.nameJa || '').toLowerCase();
                    const trStr = translateNameWithSlash(e.name || '').toLowerCase();
                    const topicStr = (e.topic || e.wikiTopic || '').toLowerCase();
                    const msgStr = (e.shortMessageJa || e.shortMessageEn || e.templateJa || e.templateEn || '').toLowerCase();
                    const aliasesStr = Array.isArray(e.aliases) ? e.aliases.join(' ').toLowerCase() : '';
                    
                    let compMatch = false;
                    if (currentTab === 'MONSTER' || currentTab === 'ITEM') {
                        const comp = getTranslationComparison(e);
                        if (comp) {
                            if (comp.rawName.toLowerCase().includes(query)) compMatch = true;
                            if (comp.knowledgeNameJa.toLowerCase().includes(query)) compMatch = true;
                            if (comp.trName.toLowerCase().includes(query)) compMatch = true;
                            if (comp.aliases.some(a => a.toLowerCase().includes(query))) compMatch = true;
                        }
                    } else if (currentTab === 'CLASS') {
                        const sym = (e.symbol || '').toLowerCase();
                        const descJa = (e.descJa || '').toLowerCase();
                        const descEn = (e.descEn || '').toLowerCase();
                        if (sym === query || sym.includes(query) || descJa.includes(query) || descEn.includes(query)) compMatch = true;
                    } else if (currentTab === 'ARTIFACT') {
                        const base = (e.baseName || '').toLowerCase();
                        const role = (e.role || '').toLowerCase();
                        const descJa = (e.descJa || '').toLowerCase();
                        const descEn = (e.descEn || '').toLowerCase();
                        const invoke = (e.invoke || '').toLowerCase();
                        if (base.includes(query) || role.includes(query) || descJa.includes(query) || descEn.includes(query) || invoke.includes(query)) compMatch = true;
                    }

                    return idStr.includes(query) || nameStr.includes(query) || trStr.includes(query) || topicStr.includes(query) || msgStr.includes(query) || aliasesStr.includes(query) || compMatch;
                }
                return true;
            });

            totalCountBadge.textContent = `${filtered.length} / ${currentList.length} Entries`;
            entityList.innerHTML = '';

            filtered.forEach(e => {
                const li = document.createElement('li');
                const eid = e.id || e.name;
                const isActive = (eid === selectedEntityId) ||
                    (currentTab === 'ITEM' && (e.onum === selectedEntityId || `item_onum_${e.onum}` === selectedEntityId || `obj_${e.onum}` === selectedEntityId)) ||
                    (currentTab === 'CLASS' && (e.symbol === selectedEntityId || `class_${e.symbol}` === selectedEntityId));
                if (isActive) selectedEntityId = eid;
                li.className = `entity-item ${isActive ? 'active' : ''}`;

                let title = e.name;
                let subtitle = e.id;
                let badgeClass = 'tag-ITEM';
                let badgeText = e.category || '';
                let iconHtml = '';
                let transBadgeHtml = '';

                if (currentTab === 'MONSTER') {
                    const comp = getTranslationComparison(e);
                    if (currentLang === 'ja') {
                        title = comp?.knowledgeNameJa || translateNameWithSlash(e.name);
                        if (comp && comp.status === 'MISMATCH') {
                            subtitle = `⚠️ 辞書: ${comp.trName} | 原名: ${comp.rawName}`;
                            transBadgeHtml = `<span class="tag-badge trans-badge-MISMATCH" style="font-size:0.6rem; padding:1px 4px;">揺れ</span>`;
                        } else if (comp && comp.status === 'UNTRANSLATED' && !comp.hasTr) {
                            subtitle = `❓ 辞書未訳 | 原名: ${comp.rawName}`;
                            transBadgeHtml = `<span class="tag-badge trans-badge-UNTRANSLATED" style="font-size:0.6rem; padding:1px 4px;">未訳</span>`;
                        } else if (comp && comp.status === 'MATCH') {
                            subtitle = comp.rawName;
                            transBadgeHtml = `<span class="tag-badge trans-badge-MATCH" style="font-size:0.6rem; padding:1px 4px;">一致</span>`;
                        } else {
                            subtitle = comp ? comp.rawName : e.name;
                        }
                    } else {
                        title = comp?.rawName || e.name;
                        subtitle = `ID: ${e.id}${e.symbol ? ` ('${e.symbol}')` : ''}`;
                        transBadgeHtml = '';
                    }
                    badgeClass = `tag-${e.dangerLevel || 'LOW'}`;
                    badgeText = e.dangerLevel;
                    const glyphId = getEntityGlyphId(e);
                    const iconStyle = getEntityGlyphStyleString(glyphId, 24);
                    iconHtml = iconStyle ? `<div style="${iconStyle}"></div>` : '👾';
                } else if (currentTab === 'ITEM') {
                    const comp = getTranslationComparison(e);
                    if (currentLang === 'ja') {
                        title = comp?.knowledgeNameJa || translateNameWithSlash(e.name);
                        if (comp && comp.status === 'MISMATCH') {
                            subtitle = `⚠️ 辞書: ${comp.trName} | 原名: ${comp.rawName}`;
                            transBadgeHtml = `<span class="tag-badge trans-badge-MISMATCH" style="font-size:0.6rem; padding:1px 4px;">揺れ</span>`;
                        } else if (comp && comp.status === 'UNTRANSLATED' && !comp.hasTr) {
                            subtitle = `❓ 辞書未訳 | 原名: ${comp.rawName}`;
                            transBadgeHtml = `<span class="tag-badge trans-badge-UNTRANSLATED" style="font-size:0.6rem; padding:1px 4px;">未訳</span>`;
                        } else if (comp && comp.status === 'MATCH') {
                            subtitle = `${comp.rawName} (onum: ${e.onum ?? 'N/A'})`;
                            transBadgeHtml = `<span class="tag-badge trans-badge-MATCH" style="font-size:0.6rem; padding:1px 4px;">一致</span>`;
                        } else {
                            subtitle = comp ? `${comp.rawName} (onum: ${e.onum ?? 'N/A'})` : `onum: ${e.onum ?? 'N/A'}`;
                        }
                    } else {
                        title = comp?.rawName || e.name;
                        subtitle = `${comp?.rawName || e.name} (onum: ${e.onum ?? 'N/A'})`;
                        transBadgeHtml = '';
                    }
                    badgeClass = 'tag-ITEM';
                    badgeText = e.category;
                    const glyphId = getEntityGlyphId(e);
                    const iconStyle = getEntityGlyphStyleString(glyphId, 24);
                    iconHtml = iconStyle ? `<div style="${iconStyle}"></div>` : '🗡️';
                } else if (currentTab === 'CLASS') {
                    title = currentLang === 'ja' ? e.nameJa : e.nameEn;
                    const symDisplay = e.symbol === ' ' ? '<space>' : e.symbol;
                    const trapText = e.raceTrap ? (currentLang === 'ja' ? ' ☠️自己虐殺注意' : ' ☠️Race Trap') : '';
                    subtitle = `シンボル: '${symDisplay}'${trapText}`;
                    badgeClass = `tag-${e.danger || 'NORMAL'}`;
                    badgeText = e.danger;
                    const charDisplay = e.symbol === ' ' ? '␣' : e.symbol;
                    iconHtml = `<div style="font-family:monospace; font-size:1.3rem; font-weight:bold; color:var(--accent-color); text-align:center; width:26px; height:26px; line-height:24px; background:rgba(0,0,0,0.3); border-radius:4px; border:1px solid rgba(56,189,248,0.3);">${charDisplay}</div>`;
                } else if (currentTab === 'ARTIFACT') {
                    title = currentLang === 'ja' ? e.nameJa : e.name;
                    const qBadge = e.isQuestArtifact ? (currentLang === 'ja' ? ' [クエスト]' : ' [Quest]') : '';
                    subtitle = `Base: ${e.baseName} | ${e.alignment}${e.role ? ` (${e.role})` : ''}${qBadge}`;
                    badgeClass = e.alignment === 'LAWFUL' ? 'tag-INFO' : (e.alignment === 'CHAOTIC' ? 'tag-LETHAL' : 'tag-LOW');
                    badgeText = e.alignment;
                    const baseOnum = e.baseOnum !== undefined ? e.baseOnum : 54;
                    const glyphId = GLYPH_OFFSETS.OBJECTS + baseOnum;
                    const iconStyle = getEntityGlyphStyleString(glyphId, 24);
                    iconHtml = iconStyle ? `<div style="${iconStyle}"></div>` : '✨';
                } else if (currentTab === 'CHARACTER') {
                    title = currentLang === 'ja' ? (e.nameJa || e.name) : e.name;
                    subtitle = e.subType;
                    badgeClass = e.subType === 'RACE' ? 'tag-PURPLE' : 'tag-INFO';
                    badgeText = e.subType;
                    const glyphId = getEntityGlyphId(e);
                    const iconStyle = getEntityGlyphStyleString(glyphId, 24);
                    iconHtml = iconStyle ? `<div style="${iconStyle}"></div>` : (e.icon || '🧙');
                } else if (currentTab === 'TERRAIN') {
                    title = currentLang === 'ja' ? (e.nameJa || translateNameWithSlash(e.name)) : (e.nameEn || e.name);
                    subtitle = e.category;
                    badgeClass = (e.category === 'LAVA' || e.category === 'WATER') ? 'tag-HIGH' : 'tag-ITEM';
                    badgeText = e.category;
                    const glyphId = getEntityGlyphId(e);
                    const iconStyle = getEntityGlyphStyleString(glyphId, 24);
                    iconHtml = iconStyle ? `<div style="${iconStyle}"></div>` : (e.icon || '🏔️');
                } else if (currentTab === 'CHEMISTRY') {
                    title = currentLang === 'ja' ? (e.nameJa || e.action?.labelJa || e.messages?.descriptionJa || e.id) : (e.nameEn || e.action?.labelEn || e.messages?.descriptionEn || e.id);
                    const routing = CHEMISTRY_ROUTING_MAP[e.id];
                    let routingBadges = '';
                    if (routing) {
                        if (routing.action.status === 'ACTIVE') routingBadges += '<span style="font-size:0.65rem; background:rgba(56,189,248,0.2); color:#38bdf8; border:1px solid #38bdf8; padding:0 3px; border-radius:3px;">ACT</span>';
                        else if (routing.action.status === 'SUPPRESSED') routingBadges += '<span style="font-size:0.65rem; background:rgba(239,68,68,0.2); color:#ef4444; border:1px solid #ef4444; padding:0 3px; border-radius:3px;">🚫ACT</span>';
                        if (routing.advisor.status === 'ACTIVE') routingBadges += '<span style="font-size:0.65rem; background:rgba(234,179,8,0.2); color:#eab308; border:1px solid #eab308; padding:0 3px; border-radius:3px;">ADV</span>';
                        if (routing.signal.status === 'ACTIVE') routingBadges += '<span style="font-size:0.65rem; background:rgba(168,85,247,0.2); color:#a855f7; border:1px solid #a855f7; padding:0 3px; border-radius:3px;">SIG</span>';
                    }
                    subtitle = routingBadges ? `<div style="display:flex; align-items:center; gap:4px; margin-top:2px;">${routingBadges} <span style="font-size:0.7rem; color:var(--text-secondary);">${e.id}</span></div>` : e.id;
                    const risk = e.action?.risk || e.effect?.risk || 'INFO';
                    badgeClass = `tag-${risk}`;
                    badgeText = risk;
                    iconHtml = '🧪';
                } else if (currentTab === 'ADVICE') {
                    title = e.id;
                    subtitle = e.topic || 'TACTICAL';
                    badgeClass = `tag-${e.severity}`;
                    badgeText = e.severity;
                    iconHtml = '💡';
                } else if (currentTab === 'SIGNAL') {
                    title = currentLang === 'ja' ? (e.shortMessageJa || e.id) : (e.shortMessageEn || e.id);
                    subtitle = e.id;
                    badgeClass = (e.stance === 'CURE' || e.stance === 'PRAY') ? 'tag-LETHAL' : 'tag-INFO';
                    badgeText = e.stance;
                    iconHtml = e.icon || '🚨';
                }

                li.innerHTML = `
                    <div class="entity-left-group">
                        <div class="entity-icon-slot">${iconHtml}</div>
                        <div class="entity-info">
                            <div class="entity-title">${title}</div>
                            <div class="entity-subtitle">${subtitle}</div>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:4px;">
                        ${transBadgeHtml}
                        <span class="tag-badge ${badgeClass}">${badgeText}</span>
                    </div>
                `;

                li.addEventListener('click', () => {
                    selectedEntityId = eid;
                    renderList();
                    renderCard();
                });

                entityList.appendChild(li);
            });
        }

        // --- 3. プレビューカード描画ディスパッチャー ---
        function renderCard() {
            if (!selectedEntityId) {
                knowledgeCard.style.display = 'none';
                emptyPlaceholder.style.display = 'block';
                return;
            }

            const currentList = ENTITIES_BY_TAB[currentTab] || [];
            const data = currentList.find(e => (
                e.id === selectedEntityId || 
                e.name === selectedEntityId ||
                (currentTab === 'ITEM' && (e.onum === selectedEntityId || `item_onum_${e.onum}` === selectedEntityId || `obj_${e.onum}` === selectedEntityId)) ||
                (currentTab === 'CLASS' && (e.symbol === selectedEntityId || `class_${e.symbol}` === selectedEntityId))
            ));

            if (!data) {
                knowledgeCard.style.display = 'none';
                emptyPlaceholder.style.display = 'block';
                return;
            }

            knowledgeCard.style.display = 'flex';
            emptyPlaceholder.style.display = 'none';

            if (currentTab === 'MONSTER') {
                renderMonsterCard(data);
            } else if (currentTab === 'ITEM') {
                renderItemCard(data);
            } else if (currentTab === 'CLASS') {
                renderClassCard(data);
            } else if (currentTab === 'ARTIFACT') {
                renderArtifactCard(data);
            } else if (currentTab === 'CHARACTER') {
                renderCharacterCard(data);
            } else if (currentTab === 'TERRAIN') {
                renderTerrainCard(data);
            } else if (currentTab === 'CHEMISTRY') {
                renderChemistryCard(data);
            } else if (currentTab === 'ADVICE') {
                renderAdviceCard(data);
            } else if (currentTab === 'SIGNAL') {
                renderSignalCard(data);
            }
        }

        // -------------------------------------------------------------
        // 3.1 モンスターカード描画
        // -------------------------------------------------------------
        function renderMonsterCard(monRaw) {
            const isTranslate = (currentLang === 'ja');
            const mon = knowledgeEngine.getMonsterKnowledge(monRaw.id, { translate: isTranslate, language: currentLang }) || monRaw;

            const badgeClass = `tag-${mon.dangerLevel || 'LOW'}`;
            const stats = mon.stats || {};
            const corpse = mon.corpse || mon.corpseInfo || {};
            const traits = mon.traits || {};
            const glyphId = getEntityGlyphId(mon);
            const iconStyle = getEntityGlyphStyleString(glyphId, 48);

            const comp = getTranslationComparison(mon);
            const displayTitle = currentLang === 'ja' ? (comp?.knowledgeNameJa || mon.name) : (comp?.rawName || mon.name);

            // 🌐 翻訳対比＆検証ボックスの HTML 構築 (日本語モード時のみ表示)
            const transComparisonHtml = (currentLang === 'ja' && comp) ? `
                <div class="trans-compare-box">
                    <div class="trans-compare-header">
                        <div class="trans-compare-title">
                            <span>🌐 翻訳対比 ＆ 表記ゆらぎ検証</span>
                            <span class="tag-badge ${comp.statusBadgeClass}">${comp.statusBadgeText}</span>
                        </div>
                        <span style="font-size:0.7rem; color:var(--text-secondary);">${comp.detailMessage}</span>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:6px 16px;">
                        <div class="trans-row">
                            <span class="trans-label">🇺🇸 英語原名:</span>
                            <span class="trans-value" style="font-family:monospace; font-weight:600;">${comp.rawName}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">📘 ナレッジ公式和名:</span>
                            <span class="trans-value ${comp.status === 'MISMATCH' ? 'trans-mismatch-val' : ''}">${comp.knowledgeNameJa}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">🌐 TranslationEngine訳:</span>
                            <span class="trans-value ${comp.status === 'MISMATCH' ? 'trans-mismatch-val' : (!comp.hasTr ? 'trans-untranslated-val' : '')}">${comp.trName}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">🏷️ 登録エイリアス(別名):</span>
                            <span class="trans-value" style="font-size:0.75rem; color:var(--text-secondary);">${comp.aliases.length > 0 ? comp.aliases.join(', ') : 'なし'}</span>
                        </div>
                    </div>
                </div>
            ` : '';

            // 公式メタデータフラグ算出
            const flags = [];
            if (mon.symbol) flags.push({ label: 'symbol', value: `'${mon.symbol}'`, badge: 'background:rgba(56,189,248,0.25); border:1px solid #38bdf8; color:#38bdf8;' });
            if (mon.className) flags.push({ label: 'class', value: mon.className, badge: 'background:rgba(168,85,247,0.25); border:1px solid #a855f7; color:#f8fafc;' });
            flags.push({ label: 'size', value: mon.size || 'MEDIUM', badge: 'background:rgba(255,255,255,0.08); border:1px solid #64748b; color:#cbd5e1;' });
            flags.push({ label: 'dangerLevel', value: mon.dangerLevel || 'LOW', badge: 'background:var(--accent-color); color:#000;' });
            if (mon.hostileDangerLevel && mon.hostileDangerLevel !== mon.dangerLevel) {
                flags.push({ label: 'hostileDanger', value: mon.hostileDangerLevel, badge: 'background:#ef4444; color:#fff;' });
            }
            flags.push({ label: 'defaultPeaceful', value: !!mon.defaultPeaceful, badge: mon.defaultPeaceful ? 'background:#22c55e; color:#000;' : 'background:#475569; color:#fff;' });
            flags.push({ label: 'canGenocide', value: mon.canGenocide ?? true, badge: (mon.canGenocide ?? true) ? 'background:#0284c7; color:#fff;' : 'background:#dc2626; color:#fff;' });
            flags.push({ label: 'canPolymorph', value: mon.canPolymorph ?? true, badge: (mon.canPolymorph ?? true) ? 'background:#10b981; color:#fff;' : 'background:#64748b; color:#fff;' });
            if (mon.isUnique) {
                flags.push({ label: 'isUnique', value: true, badge: 'background:#eab308; color:#000; font-weight:bold;' });
            }

            // 🎯 公式行動能力フラグ
            const abilityFlags = [];
            if (mon.canFly) abilityFlags.push({ label: currentLang === 'ja' ? '飛行 (Fly)' : 'Can Fly', color: '#0284c7' });
            if (mon.canSwim) abilityFlags.push({ label: currentLang === 'ja' ? '水泳 (Swim)' : 'Can Swim', color: '#0ea5e9' });
            if (mon.passesWalls) abilityFlags.push({ label: currentLang === 'ja' ? '壁抜け (Pass Walls)' : 'Passes Walls', color: '#8b5cf6' });
            if (mon.hasHands) abilityFlags.push({ label: currentLang === 'ja' ? '手あり (Hands)' : 'Has Hands', color: '#10b981' });
            if (mon.canWearArmor) abilityFlags.push({ label: currentLang === 'ja' ? '防具着用可 (Wear Armor)' : 'Can Wear Armor', color: '#f59e0b' });

            // 🎯 新スキーマ traits の真偽値フラグ抽出
            const activeTraits = [];
            const traitLabels = {
                petrifiesOnTouch: { ja: '接触石化', en: 'Petrify On Touch', color: '#ef4444' },
                paralysisGaze: { ja: '視線麻痺', en: 'Paralysis Gaze', color: '#f97316' },
                gazeConfusion: { ja: '視線混乱', en: 'Confusion Gaze', color: '#eab308' },
                fieryGaze: { ja: '火炎視線', en: 'Fiery Gaze', color: '#f97316' },
                destroysInventory: { ja: '持ち物焼失危険', en: 'Burns Inventory', color: '#ea580c' },
                explosiveEggs: { ja: '爆発卵', en: 'Explosive Eggs', color: '#e11d48' },
                explodesOnMelee: { ja: '近接爆発', en: 'Explodes On Hit', color: '#ef4444' },
                drainsLevel: { ja: 'レベルドレイン', en: 'Level Drain', color: '#dc2626' },
                rustsEquipment: { ja: '装備腐食/錆', en: 'Rusts Gear', color: '#d97706' },
                disenchantsEquipment: { ja: '装備弱体化', en: 'Disenchant Gear', color: '#9333ea' },
                eatsBrain: { ja: '知性吸い(即死)', en: 'Eats Brain (Lethal)', color: '#b91c1c' },
                causesSlime: { ja: 'スライム化(即死)', en: 'Slime Infection', color: '#16a34a' },
                drownsPlayer: { ja: '水中溺死', en: 'Drowns Player', color: '#0284c7' },
                swallowsPlayer: { ja: '丸呑み', en: 'Swallows Player', color: '#7c3aed' },
                stealsItems: { ja: 'アイテム盗み', en: 'Steals Items', color: '#059669' },
                revives: { ja: '死後復活', en: 'Revives', color: '#4f46e5' },
                castsSpells: { ja: '魔法・召喚', en: 'Casts Spells', color: '#2563eb' },
                causesLycanthropy: { ja: '獣化感染', en: 'Lycanthropy', color: '#ca8a04' },
                isUndead: { ja: 'アンデッド', en: 'Undead', color: '#64748b' },
                isDemon: { ja: '悪魔', en: 'Demon', color: '#be123c' }
            };

            Object.entries(traits).forEach(([k, v]) => {
                if (v === true && traitLabels[k]) {
                    const meta = traitLabels[k];
                    activeTraits.push({ key: k, label: currentLang === 'ja' ? meta.ja : meta.en, color: meta.color });
                }
            });

            // 💨 ブレス特性のバッジ抽出
            if (traits.breath) {
                const breathColors = {
                    cold: '#0284c7',
                    fire: '#ef4444',
                    elec: '#eab308',
                    lightning: '#eab308',
                    poison: '#16a34a',
                    acid: '#84cc16',
                    sleep: '#a855f7',
                    disintegration: '#dc2626'
                };
                const breathNameJa = {
                    cold: '吹雪ブレス',
                    fire: '火炎ブレス',
                    elec: '電撃ブレス',
                    lightning: '電撃ブレス',
                    poison: '毒ガスブレス',
                    acid: '酸ブレス',
                    sleep: '睡眠ブレス',
                    disintegration: '分解ブレス'
                };
                const bEffect = String(traits.breath).toLowerCase();
                const bColor = breathColors[bEffect] || '#0284c7';
                const bLabel = currentLang === 'ja' ? (breathNameJa[bEffect] || `${traits.breath}ブレス`) : `${traits.breath} Breath`;
                activeTraits.push({ key: 'breath', label: `💨 ${bLabel} ${currentLang === 'ja' ? '(反射可)' : '(Reflectable)'}`, color: bColor });
            }

            // 🎯 SSOT: 脆弱性・特効 (vulnerabilities: SILVER 等)
            const vulns = mon.vulnerabilities || mon.weaknesses || [];
            const hasSilverVuln = vulns.some(v => String(v).toUpperCase().includes('SILVER'));

            // 攻撃パターンの装飾生成 (特殊攻撃・属性バッジ付与)
            let attacksHtml = (mon.attacks || []).map(a => {
                const type = a.type || 'hit';
                const effect = a.effect || '';
                let icon = '⚔️';
                let tagHtml = '';

                if (type === 'breath' || type === 'brea') {
                    icon = '💨';
                    tagHtml = `<span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; background:#0284c7; color:#fff; font-weight:bold; margin-left:6px;">🛡️ ${currentLang === 'ja' ? '直線射線 / 反射有効' : 'Ray / Reflectable'}</span>`;
                } else if (type === 'gaze') {
                    icon = '👁️';
                    if (effect === 'fire') {
                        tagHtml = `<span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; background:#ea580c; color:#fff; font-weight:bold; margin-left:6px;">🕶️ ${currentLang === 'ja' ? '盲目で無効 / 可燃物注意' : 'Blind to nullify / Burns items'}</span>`;
                    } else if (effect === 'paralysis') {
                        tagHtml = `<span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; background:#dc2626; color:#fff; font-weight:bold; margin-left:6px;">⚠️ ${currentLang === 'ja' ? '直視・近接麻痺' : 'Melee Paralysis'}</span>`;
                    } else if (effect === 'confusion') {
                        tagHtml = `<span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; background:#eab308; color:#000; font-weight:bold; margin-left:6px;">🌀 ${currentLang === 'ja' ? '視線混乱' : 'Confusion'}</span>`;
                    }
                } else if (type === 'explode') {
                    icon = '💥';
                    tagHtml = `<span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; background:#dc2626; color:#fff; font-weight:bold; margin-left:6px;">💣 ${currentLang === 'ja' ? '近接自爆' : 'Explosion'}</span>`;
                } else if (type === 'touch' && effect === 'petrify') {
                    icon = '🪨';
                    tagHtml = `<span style="font-size:0.7rem; padding:2px 6px; border-radius:3px; background:#b91c1c; color:#fff; font-weight:bold; margin-left:6px;">🧤 ${currentLang === 'ja' ? '素手接触即死' : 'Fatal Touch'}</span>`;
                }

                return `<li style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
                    <span style="font-size:1rem;">${icon}</span>
                    <strong style="color:#f8fafc;">${type}</strong>
                    ${a.damage ? `<span style="color:#94a3b8; font-size:0.85rem;">(${a.damage})</span>` : ''}
                    ${effect ? `<span style="color:var(--accent-color); font-style:italic;">${effect}</span>` : ''}
                    ${tagHtml}
                </li>`;
            }).join('');

            // アドバイス (重複する死体・スペックコメントを除外し、具体的な戦術・対処カウンターを表示)
            const rawAdvice = (currentLang === 'ja' && Array.isArray(mon.tacticalAdviceJa) && mon.tacticalAdviceJa.length > 0)
                ? mon.tacticalAdviceJa
                : (mon.tacticalAdviceEn || mon.tacticalAdvice || []);

            const filteredAdvice = rawAdvice.filter(adv => {
                if (typeof adv !== 'string') return true;
                const lower = adv.toLowerCase();
                if (lower.includes('死体摂取特典') || lower.includes('corpse grants')) return false;
                if (lower.includes('死体: ') || lower.includes('corpse: ')) return false;
                if (lower.startsWith('耐性:') || lower.startsWith('resist:')) return false;
                if (lower.startsWith('有効な攻撃:') || lower.startsWith('weakness:')) return false;
                return true;
            });

            const finalAdviceList = [...filteredAdvice];
            if (mon.threat && Array.isArray(mon.threat.counters) && mon.threat.counters.length > 0) {
                mon.threat.counters.forEach(c => {
                    let counterText = '';
                    if (c.id === 'COUNTER_BLINDFOLD') {
                        counterText = currentLang === 'ja' 
                            ? '🛡️ 対処法: 目隠し(blindfold)やタオルを着用して接近・攻撃してください（直視麻痺を完全回避）。'
                            : '🛡️ Counter: Wear a blindfold or towel to approach safely without getting paralyzed.';
                    } else if (c.id === 'COUNTER_RANGED') {
                        counterText = currentLang === 'ja'
                            ? '🏹 対処法: 弓・投石(スリング)などの飛び道具で遠距離から安全に倒してください。'
                            : '🏹 Counter: Use ranged attacks or thrown projectiles to defeat safely from distance.';
                    } else if (c.id === 'COUNTER_GLOVES') {
                        counterText = currentLang === 'ja'
                            ? '🧤 対処法: 手袋(gloves)を着用していれば、死体を安全に拾って武器として利用可能です。'
                            : '🧤 Counter: Wear gloves to safely pick up and wield the corpse as a petrifying weapon.';
                    } else if (c.id === 'COUNTER_HELMET') {
                        counterText = currentLang === 'ja'
                            ? '⛑️ 対処法: 硬い兜(helmet)を装備して触手による脳食い即死を防御してください。'
                            : '⛑️ Counter: Wear a hard helmet to protect against lethal brain-eating attacks.';
                    }
                    if (counterText && !finalAdviceList.includes(counterText)) {
                        finalAdviceList.unshift(counterText);
                    }
                });
            }

            let adviceHtml = finalAdviceList.map(adv => `<li>${adv}</li>`).join('');

            // 死体
            let corpseHtml = '';
            if (corpse && typeof corpse === 'object') {
                const edibleText = corpse.edible ? (currentLang === 'ja' ? '可食' : 'Edible') : (currentLang === 'ja' ? '不可食' : 'Inedible');
                const poisonText = corpse.poisonous ? (currentLang === 'ja' ? '⚠️ 有毒' : '⚠️ Poisonous') : (currentLang === 'ja' ? '無毒' : 'Safe');
                const rawIntrinsics = Array.isArray(corpse.grantsIntrinsics) ? corpse.grantsIntrinsics : (corpse.grantResist ? [corpse.grantResist] : []);
                const intrinsics = rawIntrinsics.map(i => formatIntrinsic(i, currentLang)).join(', ');

                corpseHtml = `
                    <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:6px; padding:10px 14px;">
                        <div class="section-title" style="color:#10b981;">🍖 ${currentLang === 'ja' ? '死体・摂食情報' : 'Corpse Details'}</div>
                        <div style="font-size:0.85rem; display:flex; gap:12px; flex-wrap:wrap;">
                            <div><strong>${currentLang === 'ja' ? '摂食' : 'Edibility'}:</strong> ${edibleText}</div>
                            <div><strong>${currentLang === 'ja' ? '毒性' : 'Toxicity'}:</strong> ${poisonText}</div>
                            <div><strong>${currentLang === 'ja' ? '栄養値' : 'Nutrition'}:</strong> ${corpse.nutrition ?? 0}</div>
                            ${intrinsics ? `<div style="color:var(--accent-color);"><strong>✨ ${currentLang === 'ja' ? '獲得可能耐性' : 'Grant Intrinsics'}:</strong> ${intrinsics}</div>` : ''}
                            ${corpse.revivesFromCorpse ? `<div style="color:#ef4444;"><strong>⚠️ ${currentLang === 'ja' ? '死体から復活' : 'Revives from Corpse'}</strong></div>` : ''}
                        </div>
                    </div>
                `;
            }

            // 🎯 本編 Look (MonsterSpecPresenter) の動的スペックバッジをプレビュー表示
            const lookSpecs = getAdaptiveMonsterSpecs(mon, { language: currentLang });
            const lookBadgesHtml = lookSpecs.length > 0 ? `
                <div style="background:rgba(2,132,199,0.06); border:1px solid rgba(56,189,248,0.3); padding:10px 14px; border-radius:6px;">
                    <div class="section-title" style="color:var(--accent-color);">👀 ${currentLang === 'ja' ? 'ゲーム内 Look / インスペクター表示バッジ (In-Game Specs)' : 'In-Game Look / Spec Badges'}</div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        ${lookSpecs.map(s => {
                            const colorMap = {
                                danger: 'background:rgba(239,68,68,0.25); border:1px solid #ef4444; color:#fca5a5;',
                                warning: 'background:rgba(249,115,22,0.25); border:1px solid #f97316; color:#fdba74;',
                                info: 'background:rgba(6,182,212,0.25); border:1px solid #06b6d4; color:#67e8f9;',
                                success: 'background:rgba(34,197,94,0.25); border:1px solid #22c55e; color:#86efac;'
                            };
                            const badgeStyle = colorMap[s.type] || colorMap.info;
                            const highlightStyle = s.highlight ? 'font-weight:bold; box-shadow:0 0 8px rgba(239,68,68,0.4);' : '';
                            return `<span style="font-size:0.8rem; padding:3px 8px; border-radius:4px; ${badgeStyle} ${highlightStyle}">${s.label}</span>`;
                        }).join('')}
                    </div>
                </div>
            ` : '';

            // 🏷️ 所属モンスタークラス (SSOT)
            const clsDef = mon.monsterClass || (mon.symbol ? MONSTER_CLASS_MAP.get(mon.symbol) : null);
            let classInfoHtml = '';
            if (clsDef) {
                const trapWarning = clsDef.raceTrap ? `
                    <div style="margin-top:6px; font-size:0.78rem; color:#fca5a5; background:rgba(239,68,68,0.15); border:1px solid #ef4444; border-radius:4px; padding:4px 8px;">
                        ⚠️ <strong>${currentLang === 'ja' ? '自己虐殺即死危険:' : 'Self-Genocide Lethal:'}</strong> 
                        ${currentLang === 'ja' ? `種族 [${Array.isArray(clsDef.raceTrap) ? clsDef.raceTrap.join('/') : clsDef.raceTrap}] のプレイヤーはこのクラスを虐殺すると即死します！` : `Lethal for race [${Array.isArray(clsDef.raceTrap) ? clsDef.raceTrap.join('/') : clsDef.raceTrap}]!`}
                    </div>
                ` : '';

                classInfoHtml = `
                    <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:6px; padding:10px 14px;">
                        <div class="section-title" style="color:#38bdf8;">🏷️ ${currentLang === 'ja' ? '所属モンスタークラス (SSOT)' : 'Monster Class Definition'}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div style="font-family:monospace; font-size:1.2rem; font-weight:bold; color:var(--accent-color); width:28px; height:28px; line-height:26px; text-align:center; background:rgba(0,0,0,0.3); border-radius:4px; border:1px solid rgba(56,189,248,0.3);">${clsDef.symbol === ' ' ? '␣' : clsDef.symbol}</div>
                                <div>
                                    <strong style="color:#f8fafc;">${currentLang === 'ja' ? clsDef.nameJa : clsDef.nameEn}</strong>
                                    <span style="font-size:0.75rem; color:var(--text-secondary); margin-left:6px;">(Symbol: '${clsDef.symbol}')</span>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <span class="tag-badge tag-${clsDef.danger}">${clsDef.danger} DANGER</span>
                                <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.75rem;" id="jumpToClassBtn">
                                    ${currentLang === 'ja' ? 'クラス詳細を見る →' : 'View Class →'}
                                </button>
                            </div>
                        </div>
                        ${clsDef.descJa || clsDef.descEn ? `<div style="font-size:0.8rem; color:#94a3b8; margin-top:6px;">${currentLang === 'ja' ? (clsDef.descJa || clsDef.descEn) : (clsDef.descEn || clsDef.descJa)}</div>` : ''}
                        ${trapWarning}
                    </div>
                `;
            }

            // 🦺 変身時防具破壊リスク判定 (MonsterArmorRiskResolver)
            const armorRisk = mon.armorRisk || MonsterArmorRiskResolver.checkArmorRisk(mon);
            let armorRiskHtml = '';
            if (armorRisk) {
                const hasRisk = armorRisk.willBreakArmor || armorRisk.willDropArmor;
                const warnMsg = currentLang === 'ja' ? armorRisk.messageJa : armorRisk.messageEn;
                const details = currentLang === 'ja' ? (armorRisk.detailsJa || []) : (armorRisk.detailsEn || []);
                if (hasRisk) {
                    const blockBorder = armorRisk.willBreakArmor ? 'border-color:rgba(239,68,68,0.5); background:rgba(239,68,68,0.07);' : 'border-color:rgba(234,179,8,0.5); background:rgba(234,179,8,0.07);';
                    const titleColor = armorRisk.willBreakArmor ? '#ef4444' : '#eab308';
                    const badgeText = armorRisk.willBreakArmor ? (currentLang === 'ja' ? '防具破壊' : 'BREAKS ARMOR') : (currentLang === 'ja' ? '防具脱落' : 'DROPS ARMOR');
                    const badgeClass = armorRisk.willBreakArmor ? 'tag-LETHAL' : 'tag-HIGH';

                    armorRiskHtml = `
                        <div class="info-block" style="${blockBorder}">
                            <div class="section-title" style="color:${titleColor}; display:flex; justify-content:space-between; align-items:center;">
                                <span>🦺 ${currentLang === 'ja' ? '変身時防具破壊・脱落リスク (Polymorph Risk)' : 'Polymorph Armor Risk'}</span>
                                <span class="tag-badge ${badgeClass}" style="font-size:0.65rem;">${badgeText}</span>
                            </div>
                            <div style="font-size:0.85rem; color:#f8fafc; font-weight:600; margin-bottom:4px;">
                                ${warnMsg}
                            </div>
                            ${details.length > 0 ? `
                                <ul style="margin:4px 0 0 16px; padding:0; font-size:0.78rem; color:#cbd5e1; line-height:1.4;">
                                    ${details.map(d => `<li>${d}</li>`).join('')}
                                </ul>
                            ` : ''}
                        </div>
                    `;
                } else {
                    armorRiskHtml = `
                        <div class="info-block" style="border-color:rgba(34,197,94,0.3); background:rgba(34,197,94,0.04); padding:6px 12px;">
                            <div style="font-size:0.8rem; color:#86efac; display:flex; align-items:center; gap:6px;">
                                <span>🛡️</span>
                                <span>${currentLang === 'ja' ? '変身時の防具破壊・脱落リスクはありません（安全に変身可能）。' : 'Safe for Polymorph: No armor destruction risk.'}</span>
                            </div>
                        </div>
                    `;
                }
            }

            knowledgeCard.innerHTML = `
                <div class="card-header">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <div class="card-icon-slot">${iconStyle ? `<div style="${iconStyle}"></div>` : '👾'}</div>
                        <div class="card-title-group">
                            <h2>${displayTitle}</h2>
                            <div class="raw-name">ID: ${mon.id} | MonOffset: ${mon.monOffset ?? 'N/A'}${mon.symbol ? ` | Symbol: '${mon.symbol}'` : ''}${mon.className ? ` (${mon.className})` : ''}</div>
                        </div>
                    </div>
                    <span class="tag-badge ${badgeClass}">${mon.dangerLevel} DANGER</span>
                </div>

                ${transComparisonHtml}

                ${lookBadgesHtml}

                ${classInfoHtml}

                ${armorRiskHtml}

                <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-color); padding:10px 14px; border-radius:6px;">
                    <div class="section-title">🚩 ${currentLang === 'ja' ? '公式メタデータフラグ ＆ 特性' : 'Official Flags & Traits'}</div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
                        ${flags.map(f => `<span style="font-size:0.75rem; padding:3px 8px; border-radius:4px; font-weight:bold; ${f.badge}">${f.label}: ${f.value}</span>`).join('')}
                    </div>
                    ${abilityFlags.length > 0 ? `
                        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.1);">
                            <span style="font-size:0.75rem; color:var(--text-secondary); align-self:center; margin-right:4px;">${currentLang === 'ja' ? '行動能力:' : 'Abilities:'}</span>
                            ${abilityFlags.map(a => `<span style="font-size:0.75rem; padding:2px 7px; border-radius:4px; font-weight:bold; background:${a.color}; color:#fff;">🏃 ${a.label}</span>`).join('')}
                        </div>
                    ` : ''}
                    ${activeTraits.length > 0 ? `
                        <div style="display:flex; gap:6px; flex-wrap:wrap; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.1);">
                            ${activeTraits.map(t => `<span style="font-size:0.75rem; padding:2px 7px; border-radius:4px; font-weight:bold; background:${t.color}; color:#fff;">⚡ ${t.label}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>

                ${(mon.resistances && mon.resistances.length > 0) || (mon.weaknesses && mon.weaknesses.length > 0) ? `

                            ${art.defenseEffect ? `<div><strong style="color:#93c5fd;">🛡️ ${isJa ? '防御特殊効果' : 'Defense Effect'}:</strong> ${art.defenseEffect}</div>` : ''}

            // 呼び出し効果 (#invoke)
            let invokeHtml = '';
            if (art.invoke) {
                invokeHtml = `
                    <div class="info-block" style="border-color:rgba(168,85,247,0.5); background:rgba(168,85,247,0.08); padding:10px 14px;">
                        <div class="section-title" style="color:#c084fc;">🔮 ${isJa ? '呼び出し効果 (#invoke Effect)' : 'Invoke Effect'}</div>
                        <div style="font-size:0.9rem; color:#f8fafc; font-weight:600;">
                            ✨ ${art.invoke}

                        <div style="font-size:0.75rem; color:#cbd5e1; margin-top:2px;">

        // -------------------------------------------------------------
        // 3.2 アイテムカード描画
        // -------------------------------------------------------------
        function renderItemCard(itemRaw) {
            const isTranslate = (currentLang === 'ja');
            const targetId = (itemRaw.onum !== undefined && itemRaw.onum >= 0) ? itemRaw.onum : itemRaw.id;
            const item = knowledgeEngine.getItemKnowledge(targetId, { translate: isTranslate, language: currentLang, forceFullKnowledge: true }) || itemRaw;

            const glyphId = getEntityGlyphId(item);
            const iconStyle = getEntityGlyphStyleString(glyphId, 48);
            const comp = getTranslationComparison(item);
            const displayTitle = currentLang === 'ja' ? (comp?.knowledgeNameJa || item.name) : (comp?.rawName || item.name);

            // 🌐 翻訳対比＆検証ボックスの HTML 構築 (日本語モード時のみ表示)
            const transComparisonHtml = (currentLang === 'ja' && comp) ? `
                <div class="trans-compare-box">
                    <div class="trans-compare-header">
                        <div class="trans-compare-title">
                            <span>🌐 翻訳対比 ＆ 表記ゆらぎ検証</span>
                            <span class="tag-badge ${comp.statusBadgeClass}">${comp.statusBadgeText}</span>
                        </div>
                        <span style="font-size:0.7rem; color:var(--text-secondary);">${comp.detailMessage}</span>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:6px 16px;">
                        <div class="trans-row">
                            <span class="trans-label">🇺🇸 英語原名:</span>
                            <span class="trans-value" style="font-family:monospace; font-weight:600;">${comp.rawName}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">📘 ナレッジ公式和名:</span>
                            <span class="trans-value ${comp.status === 'MISMATCH' ? 'trans-mismatch-val' : ''}">${comp.knowledgeNameJa}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">🌐 TranslationEngine訳:</span>
                            <span class="trans-value ${comp.status === 'MISMATCH' ? 'trans-mismatch-val' : (!comp.hasTr ? 'trans-untranslated-val' : '')}">${comp.trName}</span>
                        </div>
                        <div class="trans-row">
                            <span class="trans-label">🏷️ 登録エイリアス(別名):</span>
                            <span class="trans-value" style="font-size:0.75rem; color:var(--text-secondary);">${comp.aliases.length > 0 ? comp.aliases.join(', ') : 'なし'}</span>
                        </div>
                    </div>
                </div>
            ` : '';

            // 特殊機能フラグ (is* の自動抽出 ＋ 基本メタデータ)
            const itemFlags = [];
            itemFlags.push({ label: 'category', value: item.category || 'OTHER' });
            itemFlags.push({ label: 'onum', value: item.onum ?? 'N/A' });
            if (item.sn) itemFlags.push({ label: 'sn', value: item.sn, highlight: true });
            if (item.material) itemFlags.push({ label: 'material', value: item.material });
            if (item.prob !== undefined && item.prob !== null) itemFlags.push({ label: 'prob', value: item.prob });
            if (item.delay) itemFlags.push({ label: 'delay', value: `${item.delay}t` });
            if (item.color) itemFlags.push({ label: 'color', value: item.color.replace('CLR_', '') });
            if (item.hands) itemFlags.push({ label: 'hands', value: item.hands === 2 ? '2-Handed' : '1-Handed' });
            if (item.skill && item.skill !== 'none') itemFlags.push({ label: 'skill', value: item.skill });
            if (item.strikeType && Array.isArray(item.strikeType) && !item.strikeType.includes('none')) {
                itemFlags.push({ label: 'strikeType', value: item.strikeType.join('/') });
            }
            if (item.spellLevel) itemFlags.push({ label: 'spellLv', value: item.spellLevel });
            if (item.spellSkill) itemFlags.push({ label: 'spellSkill', value: item.spellSkill });
            if (item.zapType) itemFlags.push({ label: 'zapType', value: item.zapType });

            // item オブジェクト内の真偽値フラグ (is*) を生データから網羅抽出
            Object.keys(item).forEach(key => {
                if (key.startsWith('is') && typeof item[key] === 'boolean' && item[key] === true) {
                    itemFlags.push({ 
                        label: key, 
                        value: 'true', 
                        highlight: (key === 'isSilver' || key === 'isUnique' || key === 'isMagical')
                    });
                }
            });

            // 🎯 SSOT: 防護モデル (protectsAgainst)
            const protects = item.protectsAgainst || item.stats?.protectsAgainst || [];

            // 🎯 SSOT: 効果フラグ (effects)
            const effects = item.effects || {};
            const effectEntries = Object.entries(effects).filter(([_, v]) => Boolean(v));

            const isHazard = chem.category === 'HAZARD' || chem.action?.verb === 'DO_NOT_INSERT';
            const isCritical = risk === 'CRITICAL' || risk === 'LETHAL' || isHazard;
            const action = chem.action || {};
            const effect = chem.effect || {};
            const messages = chem.messages || {};

            const displayTitle = currentLang === 'ja' 
                ? (chem.nameJa || action.labelJa || messages.descriptionJa || chem.id) 
                : (chem.nameEn || action.labelEn || messages.descriptionEn || chem.id);
            const descText = currentLang === 'ja' ? (messages.descriptionJa || messages.descriptionEn) : (messages.descriptionEn || messages.descriptionJa);
            const noteText = currentLang === 'ja' ? (effect.noteJa || effect.noteEn) : (effect.noteEn || effect.noteJa);
            const adviceText = currentLang === 'ja' ? (messages.adviceJa || messages.adviceEn) : (messages.adviceEn || messages.adviceJa);

            const keys = action.keySequence || (action.verb ? [action.verb] : []);

            // クロスリファレンス情報の取得
            const routing = CHEMISTRY_ROUTING_MAP[chem.id] || {
                action: { status: 'NONE', reasonJa: '未配線', reasonEn: 'Not routed' },
                advisor: { status: 'NONE', reasonJa: '未配線', reasonEn: 'Not routed' },
                signal: { status: 'NONE', reasonJa: '未配線', reasonEn: 'Not routed' }

                    <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-color); padding:10px 14px; border-radius:6px;">
                        <div class="section-title">🎯 ${currentLang === 'ja' ? '発動トリガー条件 (Trigger Requirements)' : 'Trigger Requirements'}</div>
                        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
                            ${triggerBadges.map(b => `<span style="font-size:0.75rem; padding:3px 8px; border-radius:4px; font-weight:500; ${b.color}">${b.icon} ${b.label}</span>`).join('')}
                        </div>
                    </div>
                ` : ''}

                ${descText ? `
                    <div style="font-size:0.95rem; color:#e2e8f0; line-height:1.5; padding:2px 0;">
                        ${descText}
                    </div>
                ` : ''}

                <div class="info-block ${isCritical ? 'warning-block' : 'benefit-block'}">
                    <div class="section-title" style="${isCritical ? 'color:#ef4444;' : 'color:#22c55e;'}">⚠️ ${currentLang === 'ja' ? '相互作用ルール ＆ 現象' : 'Interaction Effect'}</div>
                    <div style="font-size:0.9rem; line-height:1.5;">${noteText || '-'}</div>
                    ${action.consumesItem ? `<div style="color:#ef4444; font-weight:bold; margin-top:6px;">⚠️ ${currentLang === 'ja' ? '注意: 対象アイテムは完全に消滅・消費されます！' : 'WARNING: The item will be destroyed/consumed!'}</div>` : ''}
                </div>

                ${isHazard ? `
                    <div style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.4); padding:10px 14px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="font-weight:bold; color:#ef4444; font-size:0.85rem;">🚫 ${currentLang === 'ja' ? '禁止アクション:' : 'Prohibited Action:'}</span>
                            <span class="key-sequence" style="margin-left:8px;">
                                ${keys.map(k => `<span class="tag-badge tag-HIGH" style="font-size:0.8rem;">${k}</span>`).join('')}
                            </span>
                        </div>
                        <span style="font-size:0.8rem; color:#f87171;">LETHAL HAZARD</span>
                    </div>
                ` : (keys.length > 0 ? `
                    <div style="background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.3); padding:10px 14px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="font-weight:bold; color:var(--accent-color); font-size:0.85rem;">⌨️ ${currentLang === 'ja' ? '実行キーシーケンス:' : 'Key Sequence:'}</span>
                            <span class="key-sequence" style="margin-left:8px;">
                                ${keys.map(k => `<span class="key-badge">${k}</span>`).join(' ➔ ')}
                            </span>
                        </div>
                        <span style="font-size:0.8rem; color:#94a3b8;">${action.extCmd ? `#${action.extCmd}` : ''}</span>
                    </div>
                ` : '')}

                ${adviceText ? `
                    <div class="info-block">
                        <div class="section-title">💡 ${currentLang === 'ja' ? 'プレイヤー向け提示アドバイス' : 'Player Advice'}</div>
                        <div style="font-style:italic;">${adviceText}</div>
                    </div>
                ` : ''}
            `;
        }

        // -------------------------------------------------------------
        // 3.6 戦術アドバイスマスターカード描画
        // -------------------------------------------------------------
        function renderAdviceCard(adv) {
            knowledgeCard.innerHTML = `
                <div class="card-header">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <div class="card-icon-slot">💡</div>
                        <div class="card-title-group">
                            <h2>${adv.id}</h2>
                            <div class="raw-name">Topic: ${adv.topic || 'TACTICAL'} | BaseScore: ${adv.baseScore || 0}</div>
                        </div>
                    </div>
                    <span class="tag-badge tag-${adv.severity}">${adv.severity}</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-label">Severity</div><div class="stat-value" style="font-size:0.9rem;">${adv.severity}</div></div>
                    <div class="stat-box"><div class="stat-label">Base Score</div><div class="stat-value">${adv.baseScore}</div></div>
                    <div class="stat-box"><div class="stat-label">Topic</div><div class="stat-value" style="font-size:0.85rem;">${adv.topic}</div></div>
                    <div class="stat-box"><div class="stat-label">Default Cmd</div><div class="stat-value"><span class="key-badge">${adv.defaultCommand || '-'}</span></div></div>
                </div>

                <div class="info-block">
                    <div class="section-title">🇯🇵 日本語テンプレート (Japanese Template)</div>
                    <div style="line-height:1.5; font-size:0.9rem;">${adv.templateJa}</div>
                </div>

                <div class="info-block">
                    <div class="section-title">🇺🇸 英語テンプレート (English Template)</div>
                    <div style="line-height:1.5; font-size:0.9rem;">${adv.templateEn}</div>
                </div>
            `;
        }

        // -------------------------------------------------------------
        // 3.7 アシストシグナルマスターカード描画 (3層情報圧縮モデル)
        // -------------------------------------------------------------
        function renderSignalCard(sig) {
            const isCure = sig.stance === 'CURE' || sig.stance === 'PRAY';
            const keys = sig.defaultKeySequence || [];

            knowledgeCard.innerHTML = `
                <div class="card-header">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <div class="card-icon-slot">${sig.icon || '🚨'}</div>
                        <div class="card-title-group">
                            <h2>${sig.id}</h2>
                            <div class="raw-name">Category: ${sig.category} | Wiki: ${sig.wikiTopic || 'None'}</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <span class="tag-badge ${isCure ? 'tag-LETHAL' : 'tag-INFO'}">${sig.stance}</span>
                        <span class="tag-badge" style="background:rgba(56,189,248,0.2); border:1px solid #38bdf8; color:#38bdf8;">Priority: ${sig.priority}</span>
                    </div>
                </div>

                <div class="section-title" style="margin-top:6px;">📐 3層情報圧縮モデル プレビュー (3-Layer Compression)</div>

                <!-- Layer 1: Nano Badge -->
                <div class="layer-box">
                    <div class="layer-header">
                        <span>Layer 1: Nano Badge (${currentLang === 'ja' ? '所持品・魔法スロット表示' : 'Slot / Minimal'})</span>
                        <span class="tag-badge tag-LOW">Minimal</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div style="display:flex; align-items:center; gap:6px; background:#0f172a; padding:6px 12px; border-radius:6px; border:1px solid #38bdf8;">
                            <span style="font-size:1.2rem;">${sig.icon}</span>
                            <span class="key-badge">a</span>
                            <span style="font-size:0.8rem; font-weight:bold; color:#38bdf8;">${currentLang === 'ja' ? '推奨スロット' : 'Slot'}</span>
                        </div>
                        <span style="font-size:0.8rem; color:#94a3b8;">${currentLang === 'ja' ? 'インベントリ枠線ハイライト ＆ 最短アクション示唆' : 'Inventory slot highlight & optimal action'}</span>
                    </div>
                </div>

                <!-- Layer 2: 1-Line Signal -->
                <div class="layer-box">
                    <div class="layer-header">
                        <span>Layer 2: 1-Line Signal (${currentLang === 'ja' ? 'HUD最上部バー' : 'HUD Banner'})</span>
                        <span class="tag-badge tag-HIGH">HUD Banner</span>
                    </div>
                    <div style="background:#0f172a; border-left:4px solid #38bdf8; padding:8px 12px; border-radius:4px; font-weight:bold; font-size:0.9rem;">
                        ${currentLang === 'ja' ? sig.shortMessageJa : sig.shortMessageEn}
                    </div>
                </div>

                <!-- Layer 3: Action & Why -->
                <div class="layer-box">
                    <div class="layer-header">
                        <span>Layer 3: Action & Why (${currentLang === 'ja' ? 'ワンタップ実行 ＆ 理由解説' : 'Expanded'})</span>
                        <span class="tag-badge tag-PURPLE">Expanded</span>
                    </div>
                    
                    <div style="display:flex; align-items:center; justify-content:space-between; background:#0f172a; padding:8px 12px; border-radius:4px;">
                        <div>
                            <strong style="color:var(--accent-color);">${currentLang === 'ja' ? 'アクション:' : 'Action:'}</strong>
                            <span style="margin-left:6px;">${currentLang === 'ja' ? sig.actionLabelJa : sig.actionLabelEn}</span>
                        </div>
                        <div class="key-sequence">
                            ${keys.map(k => `<span class="key-badge">${k}</span>`).join(' ➔ ')}
                        </div>
                    </div>

                    <div style="font-size:0.85rem; line-height:1.5; color:#cbd5e1; padding:4px 0;">
                        <strong>Why:</strong> ${currentLang === 'ja' ? sig.detailWhyJa : sig.detailWhyEn}
                    </div>

                    ${sig.wikiTopic ? `
                        <div style="font-size:0.75rem; color:#94a3b8; text-align:right;">
                            📚 Wiki: <code>${sig.wikiTopic}</code>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 初期描画実行
        renderList();
        renderCard();
    </script>
</body>
</html>
