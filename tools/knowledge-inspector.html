<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetHack WebUI - Structured Knowledge Inspector</title>
    <!-- 統合実行辞書 nhMessage.js および タイルマッピングのロード -->
    <script src="../param/nhMessage.js"></script>
    <script src="../param/tileMapping.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;

            --danger-lethal: #ef4444;
            --danger-high: #f97316;
            --danger-medium: #eab308;
            --danger-low: #22c55e;
            --badge-info: #06b6d4;
            --badge-purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span.badge {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--accent-color);
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-toggle {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
        }

        .lang-toggle button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-toggle button.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        /* カテゴリ・タブバー */
        .nav-tabs {
            display: flex;
            background-color: #131d31;
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            gap: 4px;
            overflow-x: auto;
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            font-weight: 600;
            background: rgba(56, 189, 248, 0.08);
        }

        .nav-tab .tab-count {
            font-size: 0.7rem;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 6px;
            border-radius: 10px;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左カラム: リスト・検索 */
        .sidebar {
            width: 360px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box input, .search-box select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .search-box input:focus, .search-box select:focus {
            border-color: var(--accent-color);
        }

        .filters-row {
            display: flex;
            gap: 8px;
        }

        .entity-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .entity-item {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: background 0.15s;
        }

        .entity-item:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .entity-item.active {
            background-color: rgba(56, 189, 248, 0.15);
            border-left: 4px solid var(--accent-color);
        }

        .entity-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .entity-icon-slot {
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .card-icon-slot {
            width: 52px;
            height: 52px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.6rem;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .entity-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .entity-title {
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .entity-subtitle {
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag-badge {
            font-size: 0.68rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .tag-LETHAL, .tag-CRITICAL { background: rgba(239, 68, 68, 0.2); color: var(--danger-lethal); border: 1px solid var(--danger-lethal); }
        .tag-HIGH, .tag-WARNING { background: rgba(249, 115, 22, 0.2); color: var(--danger-high); border: 1px solid var(--danger-high); }
        .tag-MEDIUM, .tag-CAUTION { background: rgba(234, 179, 8, 0.2); color: var(--danger-medium); border: 1px solid var(--danger-medium); }
        .tag-LOW, .tag-BENEFIT, .tag-SAFE { background: rgba(34, 197, 94, 0.2); color: var(--danger-low); border: 1px solid var(--danger-low); }
        .tag-INFO { background: rgba(6, 182, 212, 0.2); color: var(--badge-info); border: 1px solid var(--badge-info); }
        .tag-ITEM { background: rgba(148, 163, 184, 0.2); color: var(--text-secondary); border: 1px solid var(--text-secondary); }
        .tag-PURPLE { background: rgba(168, 85, 247, 0.2); color: var(--badge-purple); border: 1px solid var(--badge-purple); }

        /* 翻訳ステータスバッジ */
        .trans-badge-MATCH { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }
        .trans-badge-MISMATCH { background: rgba(249, 115, 22, 0.25); color: #fdba74; border: 1px solid #f97316; }
        .trans-badge-UNTRANSLATED { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }

        /* 翻訳対比＆検証ボックス */
        .trans-compare-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trans-compare-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        .trans-compare-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trans-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .trans-label {
            width: 145px;
            flex-shrink: 0;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .trans-value {
            color: var(--text-primary);
            word-break: break-all;
        }

        .trans-mismatch-val {
            color: #fb923c;
            font-weight: bold;
        }

        .trans-untranslated-val {
            color: #f87171;
            font-style: italic;
        }

        /* 右カラム: ナレッジプレビューカード */
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .knowledge-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 760px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .card-title-group h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card-title-group .raw-name {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .stat-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .stat-box .stat-value {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 2px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .info-block {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .warning-block {
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
        }

        .benefit-block {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.05);
        }

        .advice-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .advice-list li {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 0 4px 4px 0;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* キーストローク・バブル */
        .key-badge {
            display: inline-block;
            background: #334155;
            color: #f8fafc;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #475569;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .key-sequence {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 3層情報圧縮プレビュー用スタイル */
        .layer-box {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .layer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: bold;
            text-transform: uppercase;
        }

        /* テーブルスタイル */
        .knowledge-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .knowledge-table th, .knowledge-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .knowledge-table th {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .empty-placeholder {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <span>🛠️</span> Structured Knowledge Inspector
            <span class="badge" id="totalCountBadge">0 Entities</span>
            <a href="../docs/5_gamedata/item_knowledge_dictionary.csv" target="_blank" style="font-size:0.75rem; color:#38bdf8; text-decoration:none; margin-left:10px; padding:2px 8px; border:1px dashed #38bdf8; border-radius:4px;">📄 CSV Dictionary</a>
        </h1>
        <div class="controls-bar">
            <div class="lang-toggle">
                <button id="btnJp" class="active">日本語 (JP)</button>
                <button id="btnEn">English (EN)</button>
            </div>
        </div>
    </header>

    <!-- ナレッジ種別 タブナビゲーション -->
    <nav class="nav-tabs" id="navTabs">
        <button class="nav-tab active" data-tab="MONSTER">👾 モンスター <span class="tab-count" id="count-MONSTER">0</span></button>
        <button class="nav-tab" data-tab="CLASS">🏷️ クラス <span class="tab-count" id="count-CLASS">0</span></button>
        <button class="nav-tab" data-tab="ITEM">🗡️ アイテム <span class="tab-count" id="count-ITEM">0</span></button>
        <button class="nav-tab" data-tab="ARTIFACT">✨ アーティファクト <span class="tab-count" id="count-ARTIFACT">0</span></button>
        <button class="nav-tab" data-tab="CHARACTER">🧙 種族・職業 <span class="tab-count" id="count-CHARACTER">0</span></button>
        <button class="nav-tab" data-tab="TERRAIN">🏔️ 地形・設備 <span class="tab-count" id="count-TERRAIN">0</span></button>
        <button class="nav-tab" data-tab="CHEMISTRY">🧪 ケミストリー <span class="tab-count" id="count-CHEMISTRY">0</span></button>
        <button class="nav-tab" data-tab="ADVICE">💡 戦術アドバイス <span class="tab-count" id="count-ADVICE">0</span></button>
        <button class="nav-tab" data-tab="SIGNAL">🚨 アシストシグナル <span class="tab-count" id="count-SIGNAL">0</span></button>
    </nav>

    <div class="main-container">
        <!-- 左カラム: 検索＆エンティティ一覧 -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search name, ID, or effects...">
                <div class="filters-row" id="filterContainer">
                    <!-- 動的カテゴリーフィルター -->
                    <select id="subFilter" style="flex: 1; min-width: 0;">
                        <option value="ALL">All Categories</option>
                    </select>
                    <!-- 翻訳検証フィルター (MONSTER / ITEM タブ用) -->
                    <select id="transFilter" style="flex: 1; min-width: 0;">
                        <option value="ALL">🌐 全翻訳状態</option>
                        <option value="MISMATCH">⚠️ 訳揺れ検知</option>
                        <option value="UNTRANSLATED">❓ 辞書未訳</option>
                        <option value="MATCH">✅ 完全一致</option>
                    </select>
                </div>
            </div>
            <ul class="entity-list" id="entityList"></ul>
        </div>

        <!-- 右カラム: プレビューカード -->
        <div class="content-area">
            <div class="knowledge-card" id="knowledgeCard" style="display: none;"></div>
            <div class="empty-placeholder" id="emptyPlaceholder">
                <p>Select an entity from the list to preview its structured knowledge card.</p>
            </div>
        </div>
    </div>

    <!-- ES Module Script -->
    <script type="module">
        import { StructuredKnowledgeEngine, MONSTER_KNOWLEDGE_BASE, ITEM_KNOWLEDGE_BASE } from '../src/core/knowledge/StructuredKnowledgeEngine.js';
        import { OBJECT_KNOWLEDGE_MAP } from '../src/core/knowledge/OBJECT_KNOWLEDGE_FULL.js';
        import { getAdaptiveItemSpecs } from '../src/core/knowledge/ItemSpecPresenter.js';
        import { getAdaptiveMonsterSpecs } from '../src/core/knowledge/MonsterSpecPresenter.js';
        import { getItemInfoFromOnum, GLYPH_OFFSETS } from '../src/core/knowledge/glyphClassifier.js';
        import { GlyphHelper } from '../src/core/renderers/GlyphHelper.js';
        import { TranslationEngine } from '../src/core/translation/TranslationEngine.js';

        // SSOT ナレッジマスター群のインポート
        import { ALL_MONSTER_KNOWLEDGE_BASE } from '../src/core/knowledge/MONSTER_KNOWLEDGE_FULL.js';
        import { MONSTER_JP_MAP } from '../src/core/knowledge/MONSTER_JP_MAP.js';
        import { OBJECT_KNOWLEDGE_BASE } from '../src/core/knowledge/OBJECT_KNOWLEDGE_BASE.js';
        import { OBJECT_JP_MAP } from '../src/core/knowledge/OBJECT_JP_MAP.js';
        import { MONSTER_TILEMAP_NAMES, OBJECT_TILEMAP_NAMES } from '../src/core/knowledge/tilemappings_data.js';
        import { RACE_KNOWLEDGE_MAP, ROLE_KNOWLEDGE_MAP } from '../src/core/knowledge/CHARACTER_KNOWLEDGE_BASE.js';
        import { TERRAIN_KNOWLEDGE_MAP } from '../src/core/knowledge/TERRAIN_KNOWLEDGE_BASE.js';
        import { CHEMISTRY_INTERACTIONS } from '../src/core/knowledge/CHEMISTRY_KNOWLEDGE_BASE.js';
        import { ADVICE_DEFINITIONS } from '../src/core/knowledge/ADVICE_DEFINITIONS.js';
        import { ASSIST_SIGNAL_DEFINITIONS } from '../src/core/knowledge/ASSIST_SIGNAL_DEFINITIONS.js';
        import { MONSTER_CLASS_DEFINITIONS, MONSTER_CLASS_MAP } from '../src/core/knowledge/MONSTER_CLASS_KNOWLEDGE.js';
        import { MonsterArmorRiskResolver } from '../src/core/knowledge/MonsterArmorRiskResolver.js';
        import { ARTIFACT_KNOWLEDGE_BASE, ARTIFACT_KNOWLEDGE_MAP } from '../src/core/knowledge/ARTIFACT_KNOWLEDGE_BASE.js';

        const translator = new TranslationEngine({ enabled: true });
        const knowledgeEngine = new StructuredKnowledgeEngine({ translationEngine: translator });

        let currentLang = 'ja'; // 'ja' | 'en'
        let currentTab = 'MONSTER';
        let selectedEntityId = 'cockatrice';

        // --- 1. エンティティリストの生成 ---
        const itemEntities = Array.from(knowledgeEngine.onumMap.values()).map(i => ({ ...i, entityType: 'ITEM' }));
        const monsterEntities = Array.from(knowledgeEngine.monOffsetMap.values()).map(m => ({ ...m, entityType: 'MONSTER' }));
        const classEntities = MONSTER_CLASS_DEFINITIONS.map(c => ({
            ...c,
            id: `class_${c.symbol === ' ' ? 'space' : c.symbol}`,
            name: c.nameEn,
            entityType: 'CLASS'
        }));
        const artifactEntities = ARTIFACT_KNOWLEDGE_BASE.map(a => ({
            ...a,
            entityType: 'ARTIFACT'
        }));

        const characterEntities = [
            ...Object.values(RACE_KNOWLEDGE_MAP).map(r => ({ ...r, entityType: 'CHARACTER', subType: 'RACE', icon: '🧝' })),
            ...Object.values(ROLE_KNOWLEDGE_MAP).map(r => ({ ...r, entityType: 'CHARACTER', subType: 'ROLE', icon: '🧙' }))
        ];

        const terrainEntities = Object.values(TERRAIN_KNOWLEDGE_MAP).map(t => ({ ...t, entityType: 'TERRAIN' }));
        const chemistryEntities = CHEMISTRY_INTERACTIONS.map(c => ({ ...c, entityType: 'CHEMISTRY' }));
        const adviceEntities = Object.values(ADVICE_DEFINITIONS).map(a => ({ ...a, entityType: 'ADVICE' }));
        const signalEntities = Object.values(ASSIST_SIGNAL_DEFINITIONS).map(s => ({ ...s, entityType: 'SIGNAL' }));

        const ENTITIES_BY_TAB = {
            MONSTER: monsterEntities,
            ITEM: itemEntities,
            CLASS: classEntities,
            ARTIFACT: artifactEntities,
            CHARACTER: characterEntities,
            TERRAIN: terrainEntities,
            CHEMISTRY: chemistryEntities,
            ADVICE: adviceEntities,
            SIGNAL: signalEntities
        };

        // タブ表示定義 (SSOT)
        const TAB_LABELS = {
            MONSTER: { ja: '👾 モンスター', en: '👾 Monsters' },
            ITEM: { ja: '🗡️ アイテム', en: '🗡️ Items' },
            CLASS: { ja: '🏷️ クラス', en: '🏷️ Classes' },
            ARTIFACT: { ja: '✨ アーティファクト', en: '✨ Artifacts' },
            CHARACTER: { ja: '🧙 種族・職業', en: '🧙 Races & Roles' },
            TERRAIN: { ja: '🏔️ 地形・設備', en: '🏔️ Terrains & Features' },
            CHEMISTRY: { ja: '🧪 ケミストリー', en: '🧪 Chemistry' },
            ADVICE: { ja: '💡 戦術アドバイス', en: '💡 Tactical Advice' },
            SIGNAL: { ja: '🚨 アシストシグナル', en: '🚨 Assist Signals' }
        };

        function updateTabLabels() {
            document.querySelectorAll('.nav-tab').forEach(tabBtn => {
                const tabKey = tabBtn.dataset.tab;
                const labelObj = TAB_LABELS[tabKey];
                if (!labelObj) return;
                const text = currentLang === 'ja' ? labelObj.ja : labelObj.en;
                const count = (ENTITIES_BY_TAB[tabKey] || []).length;

        // 翻訳ヘルパー関数
        function translateNameWithSlash(name) {
            if (!name || typeof name !== 'string') return name || '';
            if (currentLang !== 'ja') return name;

            const braceMatch = name.match(/^([^{｛]+)[{｛]([^}｝]+)[}｝]/);
            if (braceMatch) {
                const part1 = braceMatch[1].trim();
                const part2 = braceMatch[2].trim();
                return `${translateNameWithSlash(part1)} / ${translateNameWithSlash(part2)}`;
            }

            if (name.includes('/')) {
                return name.split('/')
                    .map(part => translator.translate(part.trim()))
                    .join(' / ');
            }

            return translator.translate(name);
        }

        /**
         * エンティティの翻訳対比＆検証オブジェクトを生成 (SSOT ナレッジ和名 vs TranslationEngine 辞書訳)
         * entity が翻訳済み（name が日本語化）であっても、monOffset / onum / id から
         * 100% 確実に英語原名を特定し、辞書訳およびナレッジ公式和名と厳密に対比する。
         * @param {Object} entity
         * @returns {Object|null}
         */
        function getTranslationComparison(entity) {
            if (!entity) return null;
            const isMonster = entity.entityType === 'MONSTER' || entity.monOffset !== undefined;
            const isItem = entity.entityType === 'ITEM' || entity.onum !== undefined;
            if (!isMonster && !isItem) return null;

            let rawEnglishName = '';
            let knowledgeNameJa = '';
            let aliases = [];
            const cleanId = entity.id || '';

            if (isMonster) {
                const monOffset = (entity.monOffset !== undefined && entity.monOffset !== null) ? entity.monOffset : -1;
                // 1. ALL_MONSTER_KNOWLEDGE_BASE から英語マスターエントリを検索
                const masterMon = ALL_MONSTER_KNOWLEDGE_BASE.find(m => (monOffset >= 0 && m.monOffset === monOffset) || (cleanId && m.id === cleanId));
                
                // 英語原名の確定
                if (masterMon && masterMon.name) {
                    rawEnglishName = masterMon.name;
                } else if (monOffset >= 0 && MONSTER_TILEMAP_NAMES[monOffset]) {
                    rawEnglishName = MONSTER_TILEMAP_NAMES[monOffset].split('/')[0].trim();
                } else {
                    rawEnglishName = entity.nameEn || entity.name || '';
                }

                // ナレッジ公式和名 (MONSTER_JP_MAP / MONSTER_KNOWLEDGE_FULL 由来)
                knowledgeNameJa = masterMon?.nameJa || (rawEnglishName ? MONSTER_JP_MAP.monsters[rawEnglishName] : '') || '';
                if (typeof knowledgeNameJa === 'object' && knowledgeNameJa !== null) {
                    knowledgeNameJa = knowledgeNameJa.noun || knowledgeNameJa.adj || String(knowledgeNameJa);
                }

                // 別名・エイリアス
                aliases = masterMon?.aliases || (cleanId ? MONSTER_JP_MAP.aliases[cleanId] : []) || [];
                if (Array.isArray(entity.aliases) && entity.aliases.length > 0) {
                    aliases = Array.from(new Set([...aliases, ...entity.aliases]));
                }
            } else if (isItem) {
                const onum = (entity.onum !== undefined && entity.onum !== null)
                    ? entity.onum
                    : (typeof entity.id === 'string' && entity.id.startsWith('item_onum_') ? parseInt(entity.id.replace('item_onum_', ''), 10) : -1);

                const masterItem = (onum >= 0 && onum < OBJECT_KNOWLEDGE_BASE.length) ? OBJECT_KNOWLEDGE_BASE[onum] : null;
                const fullItem = onum >= 0 ? OBJECT_KNOWLEDGE_MAP.get(onum) : null;

                // 英語原名の確定
                if (fullItem && fullItem.name) {
                    rawEnglishName = fullItem.name;
                } else if (masterItem && masterItem.name) {
                    rawEnglishName = masterItem.name;
                } else if (onum >= 0 && OBJECT_TILEMAP_NAMES[onum]) {
                    rawEnglishName = OBJECT_TILEMAP_NAMES[onum].split('/')[0].trim();
                } else {
                    rawEnglishName = entity.nameEn || entity.name || '';
                }

                // ナレッジ公式和名 (OBJECT_JP_MAP 由来)
                const rawJp = OBJECT_JP_MAP.objects[rawEnglishName] || fullItem?.nameJa || '';
                knowledgeNameJa = (typeof rawJp === 'object' && rawJp !== null) ? (rawJp.noun || rawJp.adj || String(rawJp)) : String(rawJp || '');

                // 別名・エイリアス
                const aliasKey = rawEnglishName.toLowerCase();
                const defaultAliases = OBJECT_JP_MAP.aliases[aliasKey] ? [OBJECT_JP_MAP.aliases[aliasKey]] : [];
                aliases = fullItem?.aliases || defaultAliases;
                if (Array.isArray(entity.aliases) && entity.aliases.length > 0) {
                    aliases = Array.from(new Set([...aliases, ...entity.aliases]));
                }
            }

            // TranslationEngine (nhMessage.js 実行辞書) で英語原名を翻訳
            const trName = translateNameWithSlash(rawEnglishName);

            // 翻訳成否の判定 (英語原名と異なれば翻訳成功)
            const hasTr = Boolean(trName && trName.trim().toLowerCase() !== rawEnglishName.trim().toLowerCase());
            const hasKnowledge = Boolean(knowledgeNameJa && knowledgeNameJa.trim().toLowerCase() !== rawEnglishName.trim().toLowerCase());

            let status = 'MATCH';
            let statusBadgeText = '✅ 完全一致';
            let statusBadgeClass = 'trans-badge-MATCH';
            let detailMessage = 'ナレッジ公式和名と辞書訳が完全一致しています。';

            if (!hasTr && !hasKnowledge) {
                status = 'UNTRANSLATED';
                statusBadgeText = '❓ 未翻訳';
                statusBadgeClass = 'trans-badge-UNTRANSLATED';
                detailMessage = 'ナレッジ側・辞書側の双方が未翻訳（英語のまま）です。';
            } else if (!hasTr) {
                status = 'UNTRANSLATED';
                statusBadgeText = '❓ 辞書未訳';
                statusBadgeClass = 'trans-badge-UNTRANSLATED';
                detailMessage = 'ナレッジ公式和名は存在しますが、nhMessage.js 実行辞書に未登録です。';
            } else if (!hasKnowledge) {
                status = 'UNTRANSLATED';
                statusBadgeText = '❓ ナレッジ未訳';
                statusBadgeClass = 'trans-badge-UNTRANSLATED';
                detailMessage = '辞書訳は存在しますが、ナレッジマスター(nameJa)に未登録です。';
            } else if (knowledgeNameJa.trim() === trName.trim()) {
                status = 'MATCH';
                statusBadgeText = '✅ 完全一致';
                statusBadgeClass = 'trans-badge-MATCH';
                detailMessage = 'ナレッジ公式和名と辞書訳が完全一致しています。';
            } else {
                status = 'MISMATCH';
                statusBadgeText = '⚠️ 訳揺れ';
                statusBadgeClass = 'trans-badge-MISMATCH';
                detailMessage = `表記揺れ検知: ナレッジ「${knowledgeNameJa}」 ≠ 辞書「${trName}」`;
            }

            return {
                rawName: rawEnglishName,
                cleanId,
                knowledgeNameJa: knowledgeNameJa || rawEnglishName,
                trName: trName || rawEnglishName,
                aliases,
                status,
                statusBadgeText,
                statusBadgeClass,
                detailMessage,
                hasTr,
                hasKnowledge
            };
        }
