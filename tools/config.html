<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetHack WASM - Config</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-bg: rgba(22, 27, 34, 0.7);
            --accent-color: #3fb950;
            --accent-hover: #4cd05d;
            --danger-color: #f85149;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: rgba(48, 54, 61, 0.8);
            --glass-blur: blur(16px);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(63, 185, 80, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(31, 111, 235, 0.05) 0%, transparent 40%);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 1;
        }

        .config-card {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #8b949e 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .config-group {
            margin-bottom: 24px;
        }

        .config-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .config-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
            transform: scale(1.02);
        }

        .config-info {
            display: flex;
            flex-direction: column;
        }

        .config-label {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .config-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Essential toggle switch styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent-color);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 14px rgba(63, 185, 80, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(63, 185, 80, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid rgba(248, 81, 73, 0.2);
            font-size: 13px;
            padding: 10px;
            margin-top: 8px;
        }

        .btn-danger:hover {
            background-color: rgba(248, 81, 73, 0.1);
            border-color: var(--danger-color);
        }

        .tools-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .tools-title {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tool-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tool-link {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            text-align: center;
        }

        .tool-link:hover {
            color: var(--accent-color);
            background: rgba(63, 185, 80, 0.05);
            border-color: rgba(63, 185, 80, 0.2);
        }
    </style>
    <script type="text/javascript" src="../sys/coremin.js"></script>
    <script type="text/javascript" src="../examples/legacy-client/rogue/SoundManager.js"></script>
    <script type="text/javascript">
        // 設定のデフォルト値
        const DEFAULT_CONFIG = {
            gryph: true,
            lang: true,
            larn: true,
            debug: false,
            sound_mode: "mute",
            sound_volume: 80,
            extra_options: ""
        };

        const I18N_TEXTS = {
            ja: {
                subtitle: "システム設定",
                descGryph: "グラフィックをタイル形式に切り替えます",
                descLang: "日本語メッセージ翻訳を有効にします",
                descLarn: "未翻訳メッセージを収集します",
                descDebug: "開発者向けのデバッグ情報を表示します",
                labelSoundMode: "SOUND_MODE",
                descSoundMode: "音声再生システムと音源モードを選択します",
                labelSoundVol: "SOUND_VOLUME",
                descSoundVol: "効果音の音量を調整します",
                btnTestSound: "サウンドテスト再生",
                labelExtraOpts: "Additional NetHack OPTIONS",
                descExtraOpts: "NetHack本体のオプションを追加できます (改行区切り)",
                btnStart: "ゲーム起動",
                btnBackTitle: "← タイトルへ戻る",
                btnReset: "設定を初期化",
                toolsTitle: "開発者向けツール",
                linkTrFail: "未翻訳リスト",
                linkTrManager: "翻訳管理",
                linkTrTest: "Trans Tester",
                linkTileTest: "Tile Mapping",
                linkGpMapping: "GP Mapping",
                linkTouchMapping: "Touch Mapping",
                linkSaveManager: "セーブデータ管理",
                resetConfirm: "設定をすべて初期化しますか？"
            },
            en: {
                subtitle: "System Configuration",
                descGryph: "Switch graphics to tile mode",
                descLang: "Enable Japanese message translation",
                descLarn: "Collect untranslated messages (learning mode)",
                descDebug: "Show debug information for developers",
                labelSoundMode: "SOUND_MODE",
                descSoundMode: "Select sound playback system and audio engine",
                labelSoundVol: "SOUND_VOLUME",
                descSoundVol: "Adjust sound effect volume",
                btnTestSound: "Test Sound",
                labelExtraOpts: "Additional NetHack OPTIONS",
                descExtraOpts: "Add extra NetHack OPTIONS (newline separated)",
                btnStart: "GAME START",
                btnBackTitle: "← Back to Title",
                btnReset: "Reset to Default",
                toolsTitle: "Developer Tools",
                linkTrFail: "Untranslated List",
                linkTrManager: "Translation Manager",
                linkTrTest: "Trans Tester",
                linkTileTest: "Tile Mapping",
                linkGpMapping: "GP Mapping",
                linkTouchMapping: "Touch Mapping",
                linkSaveManager: "Save Data Manager",
                resetConfirm: "Are you sure you want to reset all configurations?"
            }
        };

        function updateLanguageUI(isJp) {
            const t = isJp ? I18N_TEXTS.ja : I18N_TEXTS.en;
            
            document.getElementById("subtitle-text").textContent = t.subtitle;
            document.getElementById("desc-gryph").textContent = t.descGryph;
            document.getElementById("desc-lang").textContent = t.descLang;
            document.getElementById("desc-larn").textContent = t.descLarn;
            document.getElementById("desc-debug").textContent = t.descDebug;
            if (document.getElementById("label-sound-mode")) document.getElementById("label-sound-mode").textContent = t.labelSoundMode;
            if (document.getElementById("desc-sound-mode")) document.getElementById("desc-sound-mode").textContent = t.descSoundMode;
            if (document.getElementById("label-sound-vol")) document.getElementById("label-sound-vol").textContent = t.labelSoundVol;
            if (document.getElementById("desc-sound-vol")) document.getElementById("desc-sound-vol").textContent = t.descSoundVol;
            if (document.getElementById("btn-test-sound")) document.getElementById("btn-test-sound").textContent = t.btnTestSound;
            document.getElementById("label-extra-opts").textContent = t.labelExtraOpts;
            document.getElementById("desc-extra-opts").textContent = t.descExtraOpts;
            document.getElementById("btn-start").textContent = t.btnStart;
            document.getElementById("btn-back-title").textContent = t.btnBackTitle;
            document.getElementById("btn-reset").textContent = t.btnReset;
            document.getElementById("tools-title").textContent = t.toolsTitle;
            document.getElementById("link-tr-fail").textContent = t.linkTrFail;
            document.getElementById("link-tr-manager").textContent = t.linkTrManager;
            document.getElementById("link-tr-test").textContent = t.linkTrTest;
            document.getElementById("link-tile-test").textContent = t.linkTileTest;
            document.getElementById("link-gp-mapping").textContent = t.linkGpMapping;
            document.getElementById("link-touch-mapping").textContent = t.linkTouchMapping;
            document.getElementById("link-save-manager").textContent = t.linkSaveManager;
        }

        function test_sound() {
            if (window.SoundManager) {
                window.SoundManager.unlockAudio();
                const mode = document.getElementById("sound_mode").value;
                const vol = parseInt(document.getElementById("sound_volume").value, 10);
                window.SoundManager.setMode(mode);
                window.SoundManager.setVolume(vol);

                if (mode === "mute") return;

                if (mode === "beep") {
                    window.SoundManager.playBeep({ notes: ["C5", "E5", "G5", "C6"], wave: "square", duration: 80 }, vol);
                } else if (mode === "wave") {
                    window.SoundManager.playWave("welcome.mp3", vol, () => {
                        window.SoundManager.playBeep({ notes: ["C5", "E5", "G5", "C6"], wave: "square", duration: 80 }, vol);
                    });
                } else { // auto
                    window.SoundManager.playSoundRule({
                        id: "se_test",
                        pattern: ".*",
                        sound: "welcome.mp3",
                        beep: { notes: ["C5", "E5", "G5", "C6"], wave: "square", duration: 80 },
                        volume: 100
                    });
                }
            }
        }

        function auto_start() {
            if (window.SoundManager) window.SoundManager.init();

            const savedConfig = JSON.parse(localStorage.getItem("nh.config")) || DEFAULT_CONFIG;

            Object.keys(savedConfig).forEach(key => {
                const el = document.getElementById(key);
                if (el) {
                    if (el.type === "checkbox") el.checked = savedConfig[key];
                    else el.value = savedConfig[key];
                }
            });

            // 音量表示ラベルの更新
            const volEl = document.getElementById("sound_volume");
            const volVal = document.getElementById("sound_volume_val");
            if (volEl && volVal) {
                volVal.textContent = `${volEl.value}%`;
                volEl.addEventListener("input", (e) => {
                    volVal.textContent = `${e.target.value}%`;
                    if (window.SoundManager) window.SoundManager.setVolume(parseInt(e.target.value, 10));
                });
            }

            const modeEl = document.getElementById("sound_mode");
            if (modeEl && window.SoundManager) {
                modeEl.addEventListener("change", (e) => {
                    window.SoundManager.setMode(e.target.value);
                });
            }

            updateLanguageUI(savedConfig.lang);

            const langCheckbox = document.getElementById("lang");
            if (langCheckbox) {
                langCheckbox.addEventListener("change", (e) => {
                    updateLanguageUI(e.target.checked);
                });
            }
        }

        function page_start() {
            const soundModeEl = document.getElementById("sound_mode");
            const soundVolEl = document.getElementById("sound_volume");
            const currentSoundMode = soundModeEl ? soundModeEl.value : (localStorage.getItem("nethack_sound_mode") || "mute");
            const currentSoundVol = soundVolEl ? parseInt(soundVolEl.value, 10) : parseInt(localStorage.getItem("nethack_sound_volume") || "80", 10);

            const config = {
                gryph: document.getElementById("gryph").checked,
                lang: document.getElementById("lang").checked,
                larn: document.getElementById("larn").checked,
                debug: document.getElementById("debug").checked,
                sound_mode: currentSoundMode,
                sound_volume: currentSoundVol,
                extra_options: document.getElementById("extra_options").value
            };

            localStorage.setItem("nh.config", JSON.stringify(config));
            window.location.href = 'game.html';
        }

        function reset_config() {
            const langCheckbox = document.getElementById("lang");
            const isJp = langCheckbox ? langCheckbox.checked : true;
            const confirmMsg = isJp ? I18N_TEXTS.ja.resetConfirm : I18N_TEXTS.en.resetConfirm;
            if (confirm(confirmMsg)) {
                localStorage.removeItem("nh.config");
                localStorage.removeItem("nethack_sound_mode");
                localStorage.removeItem("nethack_sound_volume");
                location.reload();
            }
        }
    </script>
</head>

<body onload="auto_start()">
    <div class="container">
        <div class="config-card">
            <h1>NetHack WASM</h1>
            <p class="subtitle" id="subtitle-text">System Configuration</p>

            <div class="config-group">
                <label class="config-item" for="gryph">
                    <div class="config-info">
                        <span class="config-label">USE_GLYPH</span>
                        <span class="config-desc" id="desc-gryph">グラフィックをタイル形式に切り替えます</span>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="gryph">
                        <span class="slider"></span>
                    </div>
                </label>

                <label class="config-item" for="lang">
                    <div class="config-info">
                        <span class="config-label">LANG_JP</span>
                        <span class="config-desc" id="desc-lang">日本語メッセージ翻訳を有効にします</span>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="lang">
                        <span class="slider"></span>
                    </div>
                </label>

                <label class="config-item" for="larn">
                    <div class="config-info">
                        <span class="config-label">LANG_LARNMODE</span>
                        <span class="config-desc" id="desc-larn">未翻訳メッセージを収集します</span>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="larn">
                        <span class="slider"></span>
                    </div>
                </label>

                <label class="config-item" for="debug">
                    <div class="config-info">
                        <span class="config-label">DEBUG_MSG</span>
                        <span class="config-desc" id="desc-debug">開発者向けのデバッグ情報を表示します</span>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider"></span>
                    </div>
                </label>

                <!-- Additional Options Area -->
                <div
                    style="margin-top: 24px; padding: 16px; background: rgba(255, 255, 255, 0.03); border-radius: 16px; border: 1px solid var(--border-color);">
                    <div class="config-info" style="margin-bottom: 12px;">
                        <span class="config-label" id="label-extra-opts">Additional NetHack OPTIONS</span>
                        <span class="config-desc" id="desc-extra-opts">NetHack本体のオプションを追加できます (改行区切り)</span>
                    </div>
                    <textarea id="extra_options" placeholder="autopickup\npickup_types:$\nfruit:orange"
                        style="width: 100%; height: 120px; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: monospace; font-size: 13px; resize: vertical;"></textarea>

                </div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="btn-start" onclick="page_start()">GAME START</button>
                <a href="../index.html" class="btn btn-secondary" id="btn-back-title" style="text-decoration: none; text-align: center;">← Back to Title</a>
                <button class="btn btn-danger" id="btn-reset" onclick="reset_config()">Reset to Default</button>
            </div>

            <div class="tools-section">
                <p class="tools-title" id="tools-title">Developer Tools</p>
                <div class="tool-links" style="display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap;">
                    <a href="../tests/sound_test.html" class="tool-link" id="link-sound-test" target="_blank" style="color: var(--accent-color); border-color: rgba(63, 185, 80, 0.3);">🔊 Sound Tester</a>
                    <a href="tr_fail.html" class="tool-link" id="link-tr-fail" target="_blank">未翻訳リスト</a>
                    <a href="tr_manager.html" class="tool-link" id="link-tr-manager" target="_blank">翻訳管理</a>
                    <a href="tr_test.html" class="tool-link" id="link-tr-test" target="_blank">Trans Tester</a>
                    <a href="../tests/tile_test.html" class="tool-link" id="link-tile-test" target="_blank">Tile Mapping</a>
                    <a href="../examples/legacy-client/rogue/mapping_tool.html" class="tool-link" id="link-gp-mapping" target="_blank">GP Mapping</a>
                    <a href="../examples/legacy-client/rogue/touch_mapping_tool.html" class="tool-link" id="link-touch-mapping" target="_blank">Touch Mapping</a>
                    <a href="save_manager.html" class="tool-link" id="link-save-manager" target="_blank">Save Data Manage</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
