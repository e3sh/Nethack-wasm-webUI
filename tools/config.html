<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetHack WASM - Config</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/portal-theme.css">
    <style>
        :root {
            --panel-bg: rgba(22, 27, 34, 0.75);
            --accent-color: var(--accent-green);
            --accent-hover: var(--accent-green-hover);
            --shadow: var(--shadow-md);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 32px 20px 60px;
        }

        .header-nav {
            width: 100%;
            max-width: 580px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .nav-back-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-color);
            transform: translateX(-2px);
        }

        .nav-tabs-group {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3px;
            gap: 4px;
        }

        .nav-tab-item {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 9px;
            transition: all 0.2s;
        }

        .nav-tab-item:hover {
            color: var(--text-primary);
        }

        .nav-tab-item.active {
            background: var(--panel-bg);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .container {
            width: 100%;
            max-width: 580px;
            z-index: 1;
        }

        .config-card {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #8b949e 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .config-group {
            margin-bottom: 24px;
        }

        .config-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .config-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
            transform: scale(1.02);
        }

        .config-info {
            display: flex;
            flex-direction: column;
        }

        .config-label {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .config-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Essential toggle switch styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent-color);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 14px rgba(63, 185, 80, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(63, 185, 80, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid rgba(248, 81, 73, 0.2);
            font-size: 13px;
            padding: 10px;
            margin-top: 8px;
        }

        .btn-danger:hover {
            background-color: rgba(248, 81, 73, 0.1);
            border-color: var(--danger-color);
        }

        .tools-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .tools-title {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tool-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tool-link {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            text-align: center;
        }

        .tool-link:hover {
            color: var(--accent-color);
            background: rgba(63, 185, 80, 0.05);
            border-color: rgba(63, 185, 80, 0.2);
        }
    </style>
    <script type="module">
        import { SoundCoordinator } from "../src/core/sound/SoundCoordinator.js";
        window.soundCoordinator = new SoundCoordinator({ soundDir: "../assets/sounds/" });
    </script>
    <script type="text/javascript">
        // 設定のデフォルト値
        const DEFAULT_CONFIG = {
            gryph: true,
            lang: true,
            larn: true,
            debug: false,
            item_naming_mode: "auto_memo",
            sound_mode: "mute",
            sound_volume: 80,
            extra_options: ""
        };

        const I18N_TEXTS = {
            ja: {
                subtitle: "システム設定",
                descGryph: "グラフィックをタイル形式に切り替えます",
                descLang: "日本語メッセージ翻訳を有効にします",
                descLarn: "未翻訳メッセージを収集します",
                descDebug: "開発者向けのデバッグ情報を表示します",
                labelItemNamingMode: "ITEM_NAMING_MODE",
                descItemNamingMode: "未識別アイテム使用時の名前付け動作",
                optAutoMemo: "自動メモ (直前効果を自動登録)",
                optSkip: "自動スキップ (名前付け抑止)",
                optManual: "手動入力 (従来通りダイアログ表示)",
                labelSoundMode: "SOUND_MODE",
                descSoundMode: "音声再生システムと音源モードを選択します",
                labelSoundVol: "SOUND_VOLUME",
                descSoundVol: "効果音の音量を調整します",
                btnTestSound: "サウンドテスト再生",
                labelExtraOpts: "Additional NetHack OPTIONS",
                descExtraOpts: "NetHack本体のオプションを追加できます (改行区切り)",
                btnBackTitle: "← タイトルへ戻る",
                btnReset: "設定を初期化",
                toolsTitle: "関連ツール & 開発者ポータル",
                linkSoundTest: "🔊 Sound Tester",
                linkGpMapping: "🎮 GP Mapping",
                linkTouchMapping: "📱 Touch Mapping",
                linkSaveManager: "💾 セーブデータ管理",
                linkKnowledgeInspector: "🔍 ナレッジインスペクター",
                linkDevToolsHub: "🛠️ 全開発者ツール一覧",
                resetConfirm: "設定をすべて初期化しますか？"
            },
            en: {
                subtitle: "System Configuration",
                descGryph: "Switch graphics to tile mode",
                descLang: "Enable Japanese message translation",
                descLarn: "Collect untranslated messages (learning mode)",
                descDebug: "Show debug information for developers",
                labelItemNamingMode: "ITEM_NAMING_MODE",
                descItemNamingMode: "Naming prompt behavior when using items",
                optAutoMemo: "Auto-Memo (auto-save effect message)",
                optSkip: "Auto-Skip (suppress naming)",
                optManual: "Manual (prompt for name)",
                labelSoundMode: "SOUND_MODE",
                descSoundMode: "Select sound playback system and audio engine",
                labelSoundVol: "SOUND_VOLUME",
                descSoundVol: "Adjust sound effect volume",
                btnTestSound: "Test Sound",
                labelExtraOpts: "Additional NetHack OPTIONS",
                descExtraOpts: "Add extra NetHack OPTIONS (newline separated)",
                btnBackTitle: "← Back to Title",
                btnReset: "Reset to Default",
                toolsTitle: "Related Tools & Dev Portal",
                linkSoundTest: "🔊 Sound Tester",
                linkGpMapping: "🎮 GP Mapping",
                linkTouchMapping: "📱 Touch Mapping",
                linkSaveManager: "💾 Save Data Manager",
                linkKnowledgeInspector: "🔍 Knowledge Inspector",
                linkDevToolsHub: "🛠️ All Dev Tools",
                resetConfirm: "Are you sure you want to reset all configurations?"
            }
        };

        function updateLanguageUI(isJp) {
            const t = isJp ? I18N_TEXTS.ja : I18N_TEXTS.en;
            
            if (document.getElementById("subtitle-text")) document.getElementById("subtitle-text").textContent = t.subtitle;
            if (document.getElementById("desc-lang")) document.getElementById("desc-lang").textContent = t.descLang;
            if (document.getElementById("desc-debug")) document.getElementById("desc-debug").textContent = t.descDebug;
            if (document.getElementById("label-item-naming-mode")) document.getElementById("label-item-naming-mode").textContent = t.labelItemNamingMode;
            if (document.getElementById("desc-item-naming-mode")) document.getElementById("desc-item-naming-mode").textContent = t.descItemNamingMode;
            if (document.getElementById("opt-auto-memo")) document.getElementById("opt-auto-memo").textContent = t.optAutoMemo;
            if (document.getElementById("opt-skip")) document.getElementById("opt-skip").textContent = t.optSkip;
            if (document.getElementById("opt-manual")) document.getElementById("opt-manual").textContent = t.optManual;
            if (document.getElementById("label-sound-mode")) document.getElementById("label-sound-mode").textContent = t.labelSoundMode;
            if (document.getElementById("desc-sound-mode")) document.getElementById("desc-sound-mode").textContent = t.descSoundMode;
            if (document.getElementById("label-sound-vol")) document.getElementById("label-sound-vol").textContent = t.labelSoundVol;
            if (document.getElementById("desc-sound-vol")) document.getElementById("desc-sound-vol").textContent = t.descSoundVol;
            if (document.getElementById("btn-test-sound")) document.getElementById("btn-test-sound").textContent = t.btnTestSound;
            document.getElementById("label-extra-opts").textContent = t.labelExtraOpts;
            document.getElementById("desc-extra-opts").textContent = t.descExtraOpts;
            if (document.getElementById("btn-back-nav")) document.getElementById("btn-back-nav").textContent = t.btnBackTitle;
            if (document.getElementById("btn-back-title")) document.getElementById("btn-back-title").textContent = t.btnBackTitle;
            if (document.getElementById("btn-reset")) document.getElementById("btn-reset").textContent = t.btnReset;
            if (document.getElementById("tools-title")) document.getElementById("tools-title").textContent = t.toolsTitle;
        }

        function test_sound() {
            const sc = window.soundCoordinator;
            if (!sc) return;
            sc.unlockAudio();
            const mode = document.getElementById("sound_mode").value;
            const vol = parseInt(document.getElementById("sound_volume").value, 10);
            sc.setSoundMode(mode);
            sc.setVolume(vol);

            if (mode === "mute") return;

            const beep = { notes: ["C5", "E5", "G5", "C6"], wave: "square", duration: 80 };
            if (mode === "beep") {
                sc.playBeep(beep);
            } else if (mode === "wave") {
                sc.playAudioFile("welcome.mp3").then(ok => { if (!ok) sc.playBeep(beep); });
            } else { // auto: Arbiter が wave -> beep の順で調停
                sc.playSoundByRule({ id: "se_test", sound: "welcome.mp3", beep: beep, priority: 5, cooldownMs: 0 });
            }
        }
        function saveCurrentConfig() {
            const soundModeEl = document.getElementById("sound_mode");
            const soundVolEl = document.getElementById("sound_volume");
            const currentSoundMode = soundModeEl ? soundModeEl.value : "mute";
            const currentSoundVol = soundVolEl ? parseInt(soundVolEl.value, 10) : 80;
            const itemNamingModeEl = document.getElementById("item_naming_mode");
            const currentItemNamingMode = itemNamingModeEl ? itemNamingModeEl.value : "auto_memo";

            const config = {
                gryph: document.getElementById("gryph") ? document.getElementById("gryph").checked : true,
                lang: document.getElementById("lang") ? document.getElementById("lang").checked : true,
                larn: document.getElementById("larn") ? document.getElementById("larn").checked : false,
                debug: document.getElementById("debug") ? document.getElementById("debug").checked : false,
                item_naming_mode: currentItemNamingMode,
                sound_mode: currentSoundMode,
                sound_volume: currentSoundVol,
                extra_options: document.getElementById("extra_options") ? document.getElementById("extra_options").value : ""
            };

            localStorage.setItem("nh.config", JSON.stringify(config));
        }

        function auto_start() {
            const savedConfig = JSON.parse(localStorage.getItem("nh.config")) || DEFAULT_CONFIG;

            Object.keys(savedConfig).forEach(key => {
                const el = document.getElementById(key);
                if (el) {
                    if (el.type === "checkbox") el.checked = savedConfig[key];
                    else el.value = savedConfig[key];
                }
            });

            // 音量表示ラベルの更新
            const volEl = document.getElementById("sound_volume");
            const volVal = document.getElementById("sound_volume_val");
            if (volEl && volVal) {
                volVal.textContent = `${volEl.value}%`;
                volEl.addEventListener("input", (e) => {
                    volVal.textContent = `${e.target.value}%`;
                    if (window.soundCoordinator) window.soundCoordinator.setVolume(parseInt(e.target.value, 10));
                    saveCurrentConfig();
                });
            }

            const modeEl = document.getElementById("sound_mode");
            if (modeEl && window.soundCoordinator) {
                modeEl.addEventListener("change", (e) => {
                    window.soundCoordinator.setSoundMode(e.target.value);
                    saveCurrentConfig();
                });
            }

            const itemNamingEl = document.getElementById("item_naming_mode");
            if (itemNamingEl) {
                itemNamingEl.addEventListener("change", () => {
                    saveCurrentConfig();
                });
            }

            updateLanguageUI(savedConfig.lang);

            // 全設定項目の変更時自動保存イベントバインド
            ["gryph", "lang", "larn", "debug"].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener("change", (e) => {
                        if (id === "lang") updateLanguageUI(e.target.checked);
                        saveCurrentConfig();
                    });
                }
            });

            const extraEl = document.getElementById("extra_options");
            if (extraEl) {
                extraEl.addEventListener("input", () => {
                    saveCurrentConfig();
                });
            }
        }

        function reset_config() {
            const langCheckbox = document.getElementById("lang");
            const isJp = langCheckbox ? langCheckbox.checked : true;
            const confirmMsg = isJp ? I18N_TEXTS.ja.resetConfirm : I18N_TEXTS.en.resetConfirm;
            if (confirm(confirmMsg)) {
                localStorage.removeItem("nh.config");
                location.reload();
            }
        }
    </script>
</head>

<body onload="auto_start()">
    <header class="portal-nav header-nav">
        <a href="../index.html" class="nav-back-btn" id="btn-back-nav">← タイトルへ戻る</a>
        <div class="nav-pill-group nav-tabs-group">
            <a href="scoreboard.html" class="nav-pill-item nav-tab-item accent-gold">🏆 殿堂・スコアボード</a>
            <a href="adventure_log.html" class="nav-pill-item nav-tab-item">👣 冒険手帳</a>
            <a href="config.html" class="nav-pill-item nav-tab-item active accent-green">⚙️ システム設定</a>
            <a href="save_manager.html" class="nav-pill-item nav-tab-item">💾 セーブデータ管理</a>
        </div>
    </header>

    <div class="container">
        <div class="config-card">
            <h1>NetHack WASM</h1>
            <p class="subtitle" id="subtitle-text">System Configuration</p>

                <label class="config-item" for="lang">
                    <div class="config-info">
                        <span class="config-label">LANG_JP</span>
                        <span class="config-desc" id="desc-lang">日本語メッセージ翻訳を有効にします</span>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="lang">
                        <span class="slider"></span>
                    </div>
                </label>

                <!-- サウンドモード設定 -->
                <div class="config-item" style="cursor: default;">
                    <div class="config-info">
                        <span class="config-label" id="label-sound-mode">SOUND_MODE</span>
                        <span class="config-desc" id="desc-sound-mode">効果音の再生モードを選択します</span>
                    </div>
                    <select id="sound_mode" style="background: rgba(0,0,0,0.5); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; font-size: 13px;">
                        <option value="auto">Auto (ハイブリッド推奨)</option>
                        <option value="wave">Wave (音声ファイル)</option>
                        <option value="beep">Beep (オシレーター合成)</option>
                        <option value="mute">Mute (消音)</option>
                    </select>
                </div>

                <!-- 音量設定 ＆ テスト再生 -->
                <div class="config-item" style="cursor: default; flex-direction: column; align-items: stretch; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="config-info">
                            <span class="config-label" id="label-sound-vol">SOUND_VOLUME</span>
                            <span class="config-desc" id="desc-sound-vol">効果音の音量を調整します</span>
                        </div>
                        <span id="sound_volume_val" style="font-weight: 700; font-family: monospace; color: var(--accent-color); font-size: 14px;">80%</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <input type="range" id="sound_volume" min="0" max="100" value="80" style="flex: 1; accent-color: var(--accent-color);">
                        <button type="button" class="btn btn-secondary" id="btn-test-sound" onclick="test_sound()" style="padding: 6px 14px; font-size: 12px; border-radius: 8px;">🔊 テスト再生</button>
                    </div>
                </div>

                <div class="config-item" style="cursor: default;">
                    <div class="config-info">
                        <span class="config-label" id="label-item-naming-mode">ITEM_NAMING_MODE</span>
                        <span class="config-desc" id="desc-item-naming-mode">未識別アイテム使用時の名前付け動作</span>
                    </div>
                    <select id="item_naming_mode" style="background: rgba(0,0,0,0.5); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; font-size: 13px;">
                        <option value="auto_memo" id="opt-auto-memo">自動メモ (Auto-Memo)</option>
                        <option value="skip" id="opt-skip">自動スキップ (Skip)</option>
                        <option value="manual" id="opt-manual">手動入力 (Manual)</option>
                    </select>
                </div>

                <label class="config-item" for="debug">
                    <div class="config-info">
                        <span class="config-label">DEBUG_MSG</span>
                        <span class="config-desc" id="desc-debug">開発者向けのデバッグ情報を表示します</span>
                    </div>
                    <div class="switch">
                        <input type="checkbox" id="debug">
                        <span class="slider"></span>
                    </div>
                </label>

                <!-- Additional Options Area -->
                <div style="margin-top: 20px; padding: 16px; background: rgba(255, 255, 255, 0.03); border-radius: 16px; border: 1px solid var(--border-color);">
                    <div class="config-info" style="margin-bottom: 10px;">
                        <span class="config-label" id="label-extra-opts">Additional NetHack OPTIONS</span>
                        <span class="config-desc" id="desc-extra-opts">NetHack本体のオプションを追加できます (改行区切り)</span>
                    </div>
                    <textarea id="extra_options" placeholder="autopickup&#10;pickup_types:$&#10;fruit:orange"
                        style="width: 100%; height: 90px; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: monospace; font-size: 13px; resize: vertical;"></textarea>
                </div>
            </div>

            <div class="actions" style="margin-top: 24px;">
                <button class="btn btn-danger" id="btn-reset" onclick="reset_config()">設定を初期化</button>
            </div>

            <div class="tools-section" style="margin-top: 24px; padding-top: 20px; text-align: center;">
                <p style="font-size: 12px; color: var(--text-secondary);">
                    より詳細なサウンド検証や入力キー割り当ては <a href="dev_tools.html" style="color: var(--accent-color); text-decoration: underline;">開発者ツール (dev_tools)</a> から行えます。
                </p>
            </div>
        </div>
    </div>
</body>

</html>
