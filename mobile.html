<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest_mobile.json" />
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
        }

        /* DOM版描画エリアの基本スタイル */
        #ui-root {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            z-index: 10;
        }

        /* 仮想パッドのスタイル */
        #virtual-pad {
            position: fixed;
            bottom: 96px;
            /* ステータス欄の直上 */
            left: 50%;
            width: 100%;
            max-width: 800px;
            transform: translateX(-50%);
            height: 45vh;
            /* 下半分に収まる高さ */
            z-index: 200;
            pointer-events: none;
            display: block;
        }

        .pad-group {
            display: grid;
            gap: 5px;
            pointer-events: auto;
        }

        .d-pad {
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
        }

        .action-pad {
            grid-template-columns: repeat(2, 70px);
            grid-template-rows: repeat(2, 70px);
        }

        .v-btn {
            background: rgba(100, 100, 100, 0.2);
            border: 1px solid rgba(255, 255, 100, 0.5);
            color: #fff;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-family: sans-serif;
            font-weight: bold;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(2px);
            pointer-events: auto;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            position: absolute;
            /* width/height はJSで動的に計算 */
            max-width: 80px;
            max-height: 80px;
        }

        .v-btn:active {
            background: rgba(255, 255, 0, 0.4);
            transform: scale(1.1);
        }

        .v-btn.dir {
            font-size: 20px;
            font-weight: bold;
        }

        /* Loading Overlay Style */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 20px;
            color: white;
            font-size: 18px;
            letter-spacing: 2px;
        }
    </style>
    <script src="include.js" type="text/javascript"></script>
    <title>Nethack-wasm-WebUI (Mobile)</title>
</head>

<body onload="main()">
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">LOADING NETHACK...</div>
    </div>

    <!-- Canvas版への切り替え用ボタン（デバッグ用） -->
    <div style="position:fixed; top:0; right:0; z-index:100; opacity:0.3;">
        <a href="javascript:void(0)" onclick="saveAndTransition()" style="color:white; font-size:10px;">Canvas Mode</a>
    </div>

    <!-- DOM描画のルート要素。これが存在するとDOMレンダラーが動作する -->
    <div id="ui-root">
        <!-- ここに動的に div や span が生成される -->
    </div>

    <!-- 仮想入力バッド (DOM用) -->
    <div id="virtual-pad">
        <!-- ここに grid の内容が動的に生成されます -->
    </div>

    <!-- Canvasは非表示で存在させておく（GameCoreの初期化で必要になる可能性があるため） -->
    <canvas id="layer0" style="display:none;"></canvas>

    <div id="memo">Loading...</div>

    <script>
        // 仮想ボタン入力用ヘルパー
        function vSend(action) {
            console.log("vSend:", action);
            if (!action) return;

            if (action === "FULLSCREEN") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => {
                        console.warn("Fullscreen failed:", e);
                    });
                }
                return;
            }

            if (typeof action === "string" || Array.isArray(action)) {
                if (window.g && window.g.rogue) {
                    const keys = Array.isArray(action) ? action : [action];
                    const key = keys[0];
                    const shift = keys.includes("ShiftLeft") || keys.includes("ShiftRight");
                    const ctrl = keys.includes("ControlLeft") || keys.includes("ControlRight");
                    console.log("Sending Key:", key, "shift:", shift);
                    window.g.rogue.sendKey(key, shift, ctrl, false);
                }
            } else if (typeof action === "number") {
                const io = window.g.task.read("io");
                if (io && io.GridPad) {
                    console.log("Switching Page:", action);
                    io.GridPad.setPanelPage(action);
                }
            }
        }

        // セーブして遷移
        async function saveAndTransition() {
            const rogue = (window.g && window.g.rogue) ? window.g.rogue : null;
            if (rogue && rogue.playing) {
                console.log("Save & Transition: Game is playing. Sending save command...");
                // 1. セーブコマンド (Shift + S) 送信
                vSend(["KeyS", "ShiftLeft"]);

                // 2. 「Really save?」などの確認待ち
                await new Promise(r => setTimeout(r, 600));

                // 3. 肯定 (y) 送信
                vSend(["KeyY"]);

                // 4. 「Saving...」の最終画面（入力待ち）が表示されるのを待機してスペース送信
                let waitConfirm = 15; // 0.2s * 15 = 3s
                while (rogue.playing && !rogue.isWaitingForInput() && waitConfirm > 0) {
                    await new Promise(r => setTimeout(r, 200));
                    waitConfirm--;
                }
                if (rogue.playing && rogue.isWaitingForInput()) {
                    console.log("Save & Transition: Found final save prompt. Sending Space to finish.");
                    vSend(["Space"]);
                }

                console.log("Waiting for engine to finish saving (playing flag)...");
                // 5. playing フラグが false になるのを待機（最大10秒）
                let retry = 20; // 0.5s * 20 = 10s
                while (rogue.playing && retry > 0) {
                    await new Promise(r => setTimeout(r, 500));
                    retry--;
                    if (retry % 2 === 0) console.log(`Waiting... (${retry / 2}s remaining)`);
                }

                console.log("Finalizing FS sync...");
                // 6. ファイル同期（syncfs）を考慮した念押しの待機
                await new Promise(r => setTimeout(r, 1000));
            }

            console.log("Redirecting to index.html...");
            location.href = "index.html";
        }

        // inputGridPad との同期
        function initMobileInput() {
            const io = (window.g && window.g.task) ? window.g.task.read("io") : null;
            if (!io || !io.GridPad) {
                setTimeout(initMobileInput, 200);
                return;
            }

            const pad = io.GridPad;
            const container = document.getElementById("virtual-pad");

            pad.setOnUpdate((grid) => {
                const data = pad.getGridData();
                container.innerHTML = "";

                // DWxDH のグリッドに合わせて配置。ただし上部2行はメッセージのため避ける。
                const cellW = 100 / data.dw;
                const cellH = 100 / data.dh;

                grid.forEach((item, index) => {
                    if (item.label) {
                        const btn = document.createElement("div");
                        btn.className = "v-btn";
                        btn.innerText = item.label;

                        const x = (index % data.dw);
                        const y = Math.floor(index / data.dw);

                        // ボタン間の隙間を確保しつつ配置
                        const margin = 0.5; // %
                        btn.style.width = (cellW - margin * 2) + "%";
                        btn.style.height = (cellH - margin * 2) + "%";
                        btn.style.left = (x * cellW + margin) + "%";
                        btn.style.top = (y * cellH + margin) + "%";

                        // タッチ・クリック両対応
                        const trigger = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            vSend(item.action);
                        };
                        btn.addEventListener("touchstart", trigger, { passive: false });
                        btn.addEventListener("mousedown", trigger);

                        container.appendChild(btn);
                    }
                });
            });
        }

        // main() の後に実行
        const originalMain = window.main;
        window.main = function () {
            originalMain();
            initMobileInput();
            reportWindowSize()
        };

        window.addEventListener("resize", reportWindowSize);
        function reportWindowSize() {
            const io = (window.g && window.g.task) ? window.g.task.read("io") : null;
            if (!io || !io.layoutManager) {
                setTimeout(reportWindowSize, 200);
                return;
            }
            io.layoutManager.applyResponsiveLayout(window.innerWidth, window.innerHeight);
            vSend("Period"); //Redraw main map
        }

    </script>
</body>

</html>
