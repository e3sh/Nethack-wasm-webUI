<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
        }

        /* DOM版描画エリアの基本スタイル */
        #ui-root {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            z-index: 10;
        }

        /* 仮想パッドのスタイル */
        #virtual-pad {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 200;
            /* 十分に高い値 */
            pointer-events: none;
            display: block;
            /* grid はコンテナ内の動的生成時に設定 */
        }

        .pad-group {
            display: grid;
            gap: 5px;
            pointer-events: auto;
        }

        .d-pad {
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
        }

        .action-pad {
            grid-template-columns: repeat(2, 70px);
            grid-template-rows: repeat(2, 70px);
        }

        .v-btn {
            background: rgba(100, 100, 100, 0.2);
            border: 1px solid rgba(255, 255, 100, 0.5);
            color: #fff;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-family: sans-serif;
            font-weight: bold;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(2px);
            pointer-events: auto;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            position: absolute;
            /* グリッドではなく絶対配置で制御 */
            width: 8vw;
            height: 8vw;
            max-width: 50px;
            max-height: 50px;
        }

        .v-btn:active {
            background: rgba(255, 255, 0, 0.4);
            transform: scale(1.1);
        }

        .v-btn.dir {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
    <script src="include.js" type="text/javascript"></script>
    <title>Nethack-wasm-WebUI (Mobile)</title>
</head>

<body onload="main()">
    <!-- Canvas版への切り替え用ボタン（デバッグ用） -->
    <div style="position:fixed; top:0; right:0; z-index:100; opacity:0.3;">
        <a href="javascript:void(0)" onclick="saveAndTransition()" style="color:white; font-size:10px;">Canvas Mode</a>
    </div>

    <!-- DOM描画のルート要素。これが存在するとDOMレンダラーが動作する -->
    <div id="ui-root">
        <!-- ここに動的に div や span が生成される -->
    </div>

    <!-- 仮想入力バッド (DOM用) -->
    <div id="virtual-pad">
        <!-- ここに grid の内容が動的に生成されます -->
    </div>

    <!-- Canvasは非表示で存在させておく（GameCoreの初期化で必要になる可能性があるため） -->
    <canvas id="layer0" style="display:none;"></canvas>

    <div id="memo"></div>

    <script>
        // 仮想ボタン入力用ヘルパー
        function vSend(action) {
            console.log("vSend:", action);
            if (!action) return;

            if (action === "FULLSCREEN") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => {
                        console.warn("Fullscreen failed:", e);
                    });
                }
                return;
            }

            if (typeof action === "string" || Array.isArray(action)) {
                if (window.g && window.g.rogue) {
                    const keys = Array.isArray(action) ? action : [action];
                    const key = keys[0];
                    const shift = keys.includes("ShiftLeft") || keys.includes("ShiftRight");
                    const ctrl = keys.includes("ControlLeft") || keys.includes("ControlRight");
                    console.log("Sending Key:", key, "shift:", shift);
                    window.g.rogue.sendKey(key, shift, ctrl, false);
                }
            } else if (typeof action === "number") {
                const io = window.g.task.read("io");
                if (io && io.GridPad) {
                    console.log("Switching Page:", action);
                    io.GridPad.setPanelPage(action);
                }
            }
        }

        // セーブして遷移
        async function saveAndTransition() {
            const rogue = (window.g && window.g.rogue) ? window.g.rogue : null;
            if (rogue && rogue.playing) {
                console.log("Save & Transition: Game is playing. Sending save command...");
                // 1. セーブコマンド (Shift + S) 送信
                vSend(["KeyS", "ShiftLeft"]);

                // 2. 「Really save?」などの確認待ち
                await new Promise(r => setTimeout(r, 600));

                // 3. 肯定 (y) 送信
                vSend(["KeyY"]);

                // 4. 「Saving...」の最終画面（入力待ち）が表示されるのを待機してスペース送信
                let waitConfirm = 15; // 0.2s * 15 = 3s
                while (rogue.playing && !rogue.isWaitingForInput() && waitConfirm > 0) {
                    await new Promise(r => setTimeout(r, 200));
                    waitConfirm--;
                }
                if (rogue.playing && rogue.isWaitingForInput()) {
                    console.log("Save & Transition: Found final save prompt. Sending Space to finish.");
                    vSend(["Space"]);
                }

                console.log("Waiting for engine to finish saving (playing flag)...");
                // 5. playing フラグが false になるのを待機（最大10秒）
                let retry = 20; // 0.5s * 20 = 10s
                while (rogue.playing && retry > 0) {
                    await new Promise(r => setTimeout(r, 500));
                    retry--;
                    if (retry % 2 === 0) console.log(`Waiting... (${retry / 2}s remaining)`);
                }

                console.log("Finalizing FS sync...");
                // 6. ファイル同期（syncfs）を考慮した念押しの待機
                await new Promise(r => setTimeout(r, 1000));
            }

            console.log("Redirecting to index.html...");
            location.href = "index.html";
        }

        // inputGridPad との同期
        function initMobileInput() {
            const io = (window.g && window.g.task) ? window.g.task.read("io") : null;
            if (!io || !io.GridPad) {
                setTimeout(initMobileInput, 200);
                return;
            }

            const pad = io.GridPad;
            const container = document.getElementById("virtual-pad");

            pad.setOnUpdate((grid) => {
                const data = pad.getGridData();
                container.innerHTML = "";

                // DWxDH のグリッドに合わせて配置。ただし上部2行はメッセージのため避ける。
                const cellW = 100 / data.dw;
                const cellH = 100 / data.dh;

                grid.forEach((item, index) => {
                    if (item.label) {
                        const btn = document.createElement("div");
                        btn.className = "v-btn";
                        btn.innerText = item.label;

                        const x = (index % data.dw);
                        const y = Math.floor(index / data.dw);

                        // 位置をパーセントで指定し、上部（メッセージ用）を少し空ける
                        // 12x9 の場合、y=0,1 はメッセージに重なりやすい。
                        // ユーザーの要望に合わせて「上の方」に配置しつつ重なりを抑制。
                        btn.style.left = (x * cellW) + "%";
                        btn.style.top = (y * cellH) + "%";

                        // タッチ・クリック両対応
                        const trigger = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            vSend(item.action);
                        };
                        btn.addEventListener("touchstart", trigger, { passive: false });
                        btn.addEventListener("mousedown", trigger);

                        container.appendChild(btn);
                    }
                });
            });
        }

        // main() の後に実行
        const originalMain = window.main;
        window.main = function () {
            originalMain();
            initMobileInput();
            reportWindowSize()
        };

        window.addEventListener("resize", reportWindowSize);
        function reportWindowSize() {
            
            const io = (window.g && window.g.task) ? window.g.task.read("io") : null;
            const scene = (window.g && window.g.task) ? window.g.task.read("scene") : null;
            const gm = (window.g && window.g.rogue) ? window.g.rogue : null;

            if (!io || !scene || !gm) {
                return;
            }
            //io.layout[0] = {}
            //2 status
            //3 message
            //4 window

            //[80, 24, "std_l", PTUB, 8, 16, 0, 0, null, true], //0: mainscreen stdbg
			//[80, 24, "std_l", false, 8, 16, 1, 0, null, true], //1: mainscreen_fg stdbg
			//[80, 3, "std_l", false, 8, 16, 64, 384, "rgb( 0 32 64)", true], //2:statusbar
			//[108, 36, "std_l", PTMSG, 8, 16, 48, 432, "rgb(  0  0 100)", true], //3:msg std_l
			//[80, 32, "std_l", false, 8, 16, 320, 48, "rgb(  0  0 144/0.7 )", true], //4:window  std_l
			//[32, 40, "small", PTUB, 6, 8, 0, 16, "rgb(  0 64  0/0.5)"],   //5:mode
			//[32, 70, "small", PTUB, 6, 8, 760, 16, "rgb(  0 64  0/0.5)"], //6:comment
            //{x:  0, y:  0, w:640, h:384}:0
            //{x: 64, y:384, w:640, h: 48}:2
            //{x: 48, y:432, w:864, h:576}:3
            //{x:320, y: 48, w:640, h:512}:4

            const height = window.innerHeight;
            const width = window.innerWidth;

            ///if (height >= 600 && width >= 960){
                io.layout[0].x =   0; io.layout[0].y =   0; io.layout[0].w = 640; io.layout[0].h = 384;
                io.layout[2].x =  64; io.layout[2].y = 384; io.layout[2].w = 640; io.layout[2].h =  48;
                io.layout[3].x =  48; io.layout[3].y = 432; io.layout[3].w = 864; io.layout[3].h = 576;
                io.layout[4].x = 320; io.layout[4].y =  48; io.layout[4].w = 640; io.layout[4].h = 512;

                scene.setCameraAdjparam(160);
                gm.setSimpleSL(false);
                gm.setVScroll(false);
            //} 
            if (height < 600){
                io.layout[0].x =   0; io.layout[0].y = -512 + height; io.layout[0].w = 640; io.layout[0].h = 384;
                io.layout[2].x =  16; io.layout[2].y = height - 96; io.layout[2].w = 640; io.layout[2].h =  48;
                io.layout[3].x =   0; io.layout[3].y = height - 48; io.layout[3].w = 864; io.layout[3].h = 576;
                io.layout[4].x =   0; io.layout[4].y =  0; io.layout[4].w = 640; io.layout[4].h = 512;

                //scene.setCameraAdjparam(160);
                gm.setVScroll(true);
            } 
            if (width < 640){
                io.layout[0].x =   0; io.layout[0].y =   0; io.layout[0].w = 640; io.layout[0].h = 384;
                io.layout[2].x =  16; io.layout[2].y = 384; io.layout[2].w = 320; io.layout[2].h =  48;
                io.layout[3].x =   0; io.layout[3].y = 432; io.layout[3].w = 864; io.layout[3].h = 576;
                io.layout[4].x =   0; io.layout[4].y =  48; io.layout[4].w = 640; io.layout[4].h = 512;

                scene.setCameraAdjparam((1280-width)/2);
                gm.setSimpleSL(true);
                //gm.setVScroll(false);
            } 
            //console.log(`h${height},w${width}`);

        }

    </script>
</body>

</html>
