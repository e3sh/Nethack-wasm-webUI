<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: monospace;
        }

        /* DOM版描画エリアの基本スタイル */
        #ui-root {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            z-index: 10;
        }

        /* 仮想パッドのスタイル */
        #virtual-pad {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            pointer-events: none;
            /* 下の要素を邪魔しない、ボタンだけ反応させる */
        }

        .pad-group {
            display: grid;
            gap: 5px;
            pointer-events: auto;
        }

        .d-pad {
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
        }

        .action-pad {
            grid-template-columns: repeat(2, 70px);
            grid-template-rows: repeat(2, 70px);
        }

        .v-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-family: sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(5px);
        }

        .v-btn:active {
            background: rgba(255, 165, 0, 0.5);
            transform: scale(0.95);
        }

        .v-btn.dir {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
    <script src="include.js" type="text/javascript"></script>
    <title>Nethack-wasm-WebUI (Mobile)</title>
</head>

<body onload="main()">
    <!-- Canvas版への切り替え用ボタン（デバッグ用） -->
    <div style="position:fixed; top:0; right:0; z-index:100; opacity:0.3;">
        <a href="index.html" style="color:white; font-size:10px;">Canvas Mode</a>
    </div>

    <!-- DOM描画のルート要素。これが存在するとDOMレンダラーが動作する -->
    <div id="ui-root">
        <!-- ここに動的に div や span が生成される -->
    </div>

    <!-- Canvasは非表示で存在させておく（GameCoreの初期化で必要になる可能性があるため） -->
    <canvas id="layer0" style="display:none;"></canvas>

    <div id="memo"></div>
</body>

</html>
