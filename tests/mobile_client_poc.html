<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetHack WebUI Mobile Touch PoC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 8px;
        }

        .mobile-container {
            width: 100%;
            max-width: 440px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* ヘッダー */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #27272a;
        }

        .app-title {
            font-size: 14px;
            font-weight: bold;
            color: #00e676;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-mode {
            background: #27272a;
            color: #81d4fa;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 1. 最上部: メッセージログ (コンパクト 3行) */
        .message-log-box {
            height: 54px;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1.35;
            color: #e4e4e7;
            overflow-y: auto;
        }

        .log-line {
            word-break: break-all;
        }

        /* 2. 中央: ズーム拡大メインビュー & レーダーミニマップオーバーレイ */
        .zoom-view-wrapper {
            position: relative;
            width: 100%;
            background: #000000;
            border: 2px solid #3f3f46;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1;
        }

        #nh-zoom-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 右上オーバーレイ レーダーミニマップ (80x21) */
        .radar-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00e676;
            border-radius: 4px;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .radar-title {
            font-size: 8px;
            color: #00e676;
            text-align: center;
            margin-bottom: 2px;
            font-weight: bold;
        }

        #nh-radar-canvas {
            width: 120px;
            height: 31.5px;
            display: block;
            image-rendering: pixelated;
        }

        /* 3. マップ直下: ステータスカード */
        .status-card {
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 6px 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            font-size: 11px;
            text-align: center;
        }

        .st-item {
            display: flex;
            flex-direction: column;
        }

        .st-label {
            font-size: 9px;
            color: #71717a;
        }

        .st-val {
            font-weight: bold;
            color: #f4f4f5;
        }

        /* 4. 最下部操作デッキ: 巨大プライマリボタン & コンテキストアクション */
        .control-deck {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 巨大プライマリタッチボタン */
        .primary-action-btn {
            background: linear-gradient(135deg, #1b5e20, #00e676);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 230, 118, 0.35);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .primary-action-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(0, 230, 118, 0.2);
        }

        .primary-key-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        /* タッチ十字キー (D-Pad) & 周囲アクション列 */
        .dpad-actions-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* D-Pad グリッド (3x3) */
        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 3px;
            background: #09090b;
            padding: 4px;
            border: 1px solid #27272a;
            border-radius: 8px;
        }

        .dpad-btn {
            background: #27272a;
            color: #f4f4f5;
            border: 1px solid #3f3f46;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .dpad-btn:active {
            background: #00e676;
            color: #000;
        }

        .dpad-btn.center-wait {
            background: #18181b;
            color: #ffe082;
            font-size: 11px;
        }

        /* アクションリスト (右側) */
        .sub-actions-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 130px;
            overflow-y: auto;
        }

        .sub-action-btn {
            background: #18181b;
            border: 1px solid #29b6f6;
            color: #81d4fa;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-action-btn.danger {
            border-color: #ff5252;
            color: #ff8a80;
            background: #2c0d0d;
        }

        /* モバイルプロンプト・メニューモーダル (D-Pad領域を塞がないよう画面上部に配置) */
        .mobile-modal {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%, 0);
            background: rgba(24, 24, 27, 0.96);
            border: 2px solid #00e676;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.45);
            border-radius: 10px;
            padding: 14px;
            width: 90%;
            max-width: 380px;
            max-height: 45vh;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .mobile-modal.active {
            display: flex;
        }

        .modal-title {
            color: #00e676;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .modal-btn {
            background: #18181b;
            border: 1px solid #00e676;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
        }

        /* 常時表示基本コマンドバー */
        .global-cmd-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .global-cmd-btn {
            flex: 1;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #f4f4f5;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .global-cmd-btn:active {
            background: #3f3f46;
        }

        /* インベントリ同期インジケーター */
        .inv-status-panel {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 6px 10px;
            margin: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .inv-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        .inv-badge-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .inv-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
        }
        .inv-badge.active {
            background: #1b5e20;
            border: 1px solid #00e676;
            color: #00e676;
            box-shadow: 0 0 6px rgba(0, 230, 118, 0.3);
        }
        .inv-badge.disabled {
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #71717a;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- ヘッダー -->
        <div class="app-header">
            <div class="app-title">
                <span>📱 NetHack Mobile Touch</span>
            </div>
            <div class="badge-mode">Zoomed View Mode</div>
        </div>

        <!-- 1. 最上部: メッセージログ -->
        <div id="log-box" class="message-log-box"></div>

        <!-- 2. 中央: ズーム拡大メインビュー & レーダーミニマップ -->
        <div class="zoom-view-wrapper">
            <!-- ズームメインキャンバス (11x11マス, 32pxタイル) -->
            <canvas id="nh-zoom-canvas" width="352" height="352"></canvas>

            <!-- 右上オーバーレイ 80x21 レーダーミニマップ -->
            <div class="radar-overlay">
                <div class="radar-title">RADAR (80x21)</div>
                <canvas id="nh-radar-canvas" width="80" height="21"></canvas>
            </div>
        </div>

        <!-- 3. マップ直下: ステータスカード -->
        <div class="status-card">
            <div class="st-item"><span class="st-label">DLevel</span><span id="st-dlvl" class="st-val">1</span></div>
            <div class="st-item"><span class="st-label">HP</span><span id="st-hp" class="st-val" style="color:#00e676;">- / -</span></div>
            <div class="st-item"><span class="st-label">PW</span><span id="st-pw" class="st-val" style="color:#29b6f6;">- / -</span></div>
            <div class="st-item"><span class="st-label">AC</span><span id="st-ac" class="st-val">-</span></div>
        </div>

        <!-- 3-B. インベントリ同期インジケーター (主要アイテム認識状態) -->
        <div id="inv-status-panel" class="inv-status-panel">
            <div class="inv-panel-header">
                <span style="font-weight:bold; color:#00e676;">🎒 道具認識状態 (Inventory Sync)</span>
                <span id="inv-sync-time" style="font-size:10px; color:#888;">未同期 (Press 'i')</span>
            </div>
            <div class="inv-badge-list">
                <div id="badge-pickaxe" class="inv-badge disabled">⛏️ ツルハシ: なし</div>
                <div id="badge-key" class="inv-badge disabled">🔑 鍵/ピック: なし</div>
                <div id="badge-axe" class="inv-badge disabled">🪓 斧: なし</div>
                <div id="badge-wand" class="inv-badge disabled">❄️ 氷の杖: なし</div>
            </div>
        </div>

        <!-- 4. 最下部操作デッキ -->
        <div class="control-deck">
            
            <!-- 4-A. 常時表示 基本機能 ＆ キャンセル・決定バー -->
            <div class="global-cmd-bar">
                <button class="global-cmd-btn" style="border-color:#ff5252; color:#ff8a80; font-weight:bold;" onclick="core.sendKey('Escape')">🚫 ESC</button>
                <button class="global-cmd-btn" style="border-color:#00e676; color:#00e676; font-weight:bold;" onclick="core.sendKey('Enter')">↵ Enter</button>
                <button class="global-cmd-btn" onclick="core.sendKey('i')">🎒 持ち物</button>
                <button class="global-cmd-btn" onclick="core.sendKey('s')">🔍 探す</button>
                <button class="global-cmd-btn" onclick="core.sendKey('E')">📜 刻む</button>
                <button class="global-cmd-btn" onclick="core.sendKey('.')">💤 待機</button>
            </div>

            <!-- 4-B. 巨大プライマリタッチボタン -->
            <button id="btn-primary-action" class="primary-action-btn">
                <span id="primary-key-badge" class="primary-key-badge">[,]</span>
                <span id="primary-action-label">足元のアイテムを拾う (Pick up)</span>
            </button>

            <!-- タッチ十字キー (D-Pad) & サブアクションリスト -->
            <div class="dpad-actions-container">
                <!-- D-Pad 8方向 (data-dir 属性) -->
                <div id="dpad-grid" class="dpad-grid">
                    <button class="dpad-btn" data-dir="y">↖</button>
                    <button class="dpad-btn" data-dir="k">↑</button>
                    <button class="dpad-btn" data-dir="u">↗</button>
                    <button class="dpad-btn" data-dir="h">←</button>
                    <button class="dpad-btn center-wait" data-dir="5" title="Look / Travel (5)">Look/Travel</button>
                    <button class="dpad-btn" data-dir="l">→</button>
                    <button class="dpad-btn" data-dir="b">↙</button>
                    <button class="dpad-btn" data-dir="j">↓</button>
                    <button class="dpad-btn" data-dir="n">↘</button>
                </div>

                <!-- 周囲・足元のコンテキストアクション一覧 -->
                <div id="sub-actions-list" class="sub-actions-list">
                    <span style="color:#666; font-size:10px;">(周辺アクション)</span>
                </div>
            </div>

        </div>

    </div>

    <!-- プロンプト & メニュー モーダル -->
    <div id="mobile-modal" class="mobile-modal">
        <div id="modal-title" class="modal-title">Prompt</div>
        <div id="modal-body" class="modal-body"></div>
    </div>

    <!-- パラメータ & ドライバー スクリプト読み込み -->
    <script src="../param/tileMapping.js"></script>
    <script src="../src/driver/NetHackWasmWorkerBridge.js"></script>

    <!-- Cコアファサードスクリプト読み込み -->
    <script type="module">
        import { WebUICore } from '../src/core/WebUICore.js';
        import { ContextActionEngine } from '../src/core/knowledge/ContextActionEngine.js';
        import { InventoryStateManager } from '../src/core/knowledge/InventoryStateManager.js';
        import { DirectionalActionResolver } from '../src/client/DirectionalActionResolver.js';

        const bridge = new NetHackWasmWorkerBridge();
        const core = new WebUICore({ driver: bridge });
        const inventoryState = core.getInventoryState();
        window.core = core;
        window.inventoryState = inventoryState;

        core.on('inventoryStateUpdated', () => {
            if (typeof updateDPadVisuals === 'function') updateDPadVisuals();
        });

        // モーダル DOM 参照
        const mobileModal = document.getElementById('mobile-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');

        function clearModal() {
            if (typeof isGameExited !== 'undefined' && isGameExited) return;
            if (mobileModal) mobileModal.className = 'mobile-modal';
            if (modalBody) modalBody.innerHTML = '';
        }

        // 1. メッセージログ更新 (message ＆ putstr の両方を受信)
        function appendLogMessage(msgText) {
            if (!msgText) return;
            inventoryState.updateFromMessage(msgText);
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = msgText;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        core.on('message', (msgText) => appendLogMessage(msgText));
        core.on('putstr', ({ text }) => appendLogMessage(text));

        // 2. ステータス更新
        core.on('statusUpdate', ({ status }) => {
            if (!status) return;
            if (status.dlevel) stDlvl.textContent = status.dlevel.text || status.dlevel;
            if (status.hp) stHp.textContent = `${status.hp.current} / ${status.hp.max}`;
            if (status.pw) stPw.textContent = `${status.pw.current} / ${status.pw.max}`;
            if (status.ac !== undefined) stAc.textContent = status.ac;
        });

        core.on('status_updated', (st) => {
            if (!st) return;
            if (st.dlvl !== undefined) stDlvl.textContent = st.dlvl;
            if (st.hp !== undefined) stHp.textContent = `${st.hp} / ${st.hpmax || st.hp}`;
            if (st.pw !== undefined) stPw.textContent = `${st.pw} / ${st.pwmax || st.pw}`;
            if (st.ac !== undefined) stAc.textContent = st.ac;
        });

        // 3. プロンプト & キャラクター選択 & メニューハンドラー (完全同期版)
        core.on('inputRequired', (data) => {
            clearModal();
            if (!data) return;

            const category = data.category || data.promptCategory || 'OTHER';
            const rawPrompt = data.prompt || data.message || data.question || '';
            const items = data.menuItems || data.items || [];
            const textLines = data.lines || [];

            // WebUICore がデコードした正規の構造化 MENU データが存在する場合、即座にインベントリ状態へ同期・DPad表示更新
            if (inventoryState && category === 'MENU' && items && items.length > 0) {
                inventoryState.updateFromMenuItems(items);
                if (typeof updateDPadVisuals === 'function') updateDPadVisuals();
            }

            // (A) インベントリ ＆ オプション選択 MENU 表示 (選択肢アイテム items が存在、または category === 'MENU' の場合は最優先処理)
            if (category === 'MENU' || (items && items.length > 0)) {
                mobileModal.className = 'mobile-modal active';
                modalTitle.textContent = rawPrompt || '選択してください:';

                if (textLines && textLines.length > 0) {
                    textLines.forEach(lineText => {
                        try {
                            const headerDiv = document.createElement('div');
                            headerDiv.style.fontSize = '11px';
                            headerDiv.style.color = '#81d4fa';
                            headerDiv.style.marginTop = '4px';
                            headerDiv.textContent = typeof lineText === 'string' ? lineText : JSON.stringify(lineText);
                            modalBody.appendChild(headerDiv);
                        } catch (e) {}
                    });
                }

                if (Array.isArray(items)) {
                    items.forEach(item => {
                        try {
                            if (!item) return;
                            const itemText = typeof item === 'string' ? item : (item.str || item.text || item.label);// || JSON.stringify(item));
                            if (item.isSelectable === false) {
                                const headerDiv = document.createElement('div');
                                headerDiv.style.fontSize = '11px';
                                headerDiv.style.color = '#00e676';
                                headerDiv.style.fontWeight = 'bold';
                                headerDiv.style.marginTop = '4px';
                                headerDiv.textContent = itemText;
                                modalBody.appendChild(headerDiv);
                                return;
                            }

                            const btn = document.createElement('button');
                            btn.className = 'modal-btn';
                            let chStr = '';
                            if (typeof item === 'object' && item) {
                                chStr = item.charStr || item.accelerator || item.selector || item.letter || '';
                                if (!chStr && typeof item.ch === 'number' && item.ch > 0) {
                                    chStr = String.fromCharCode(item.ch);
                                }
                            }
                            btn.textContent = chStr ? `[${chStr}] ${itemText}` : itemText;
                            btn.onclick = () => {
                                const selectVal = chStr || (item && item.accelerator) || (item && item.selector) || item;
                                clearModal();
                                core.respond(selectVal);
                            };
                            modalBody.appendChild(btn);
                        } catch (itemErr) {
                            console.error("Mobile menu item render error:", itemErr, item);
                        }
                    });
                }

                const btnCancel = document.createElement('button');
                btnCancel.className = 'modal-btn';
                btnCancel.style.borderColor = '#666';
                btnCancel.style.color = '#aaa';
                btnCancel.style.textAlign = 'center';
                btnCancel.textContent = 'キャンセル (ESC / 0)';
                btnCancel.onclick = () => {
                    clearModal();
                    core.respond(0);
                };
                modalBody.appendChild(btnCancel);
                return;
            }

            // (B) Look Information / HELP / FILE テキストウィンドウ
            if (textLines && textLines.length > 0) {
                mobileModal.className = 'mobile-modal active';
                modalTitle.textContent = rawPrompt || '詳細情報 (Text Window)';

                textLines.forEach(lineText => {
                    const lineDiv = document.createElement('div');
                    lineDiv.style.fontSize = '12px';
                    lineDiv.style.color = '#ccc';
                    lineDiv.textContent = lineText;
                    modalBody.appendChild(lineDiv);
                });

                const btn = document.createElement('button');
                btn.className = 'modal-btn';
                btn.style.textAlign = 'center';
                btn.textContent = '閉じる / 次へ (Press Space)';
                btn.onclick = () => {
                    clearModal();
                    core.sendKey('Space');
                };
                modalBody.appendChild(btn);
                return;
            }

            // (C) ASKNAME (名前プロンプト ➔ 自動で 'Hero' を応答して即時開始)
            if (category === 'ASKNAME') {
                core.respond('Hero');
                return;
            }

            // (D) YN (Yes / No 質問プロンプト)
            if (category === 'YN') {
                mobileModal.className = 'mobile-modal active';
                modalTitle.textContent = rawPrompt || '質問 [Y/N]';
                const choices = data.choices || data.ynChoices || (rawPrompt.match(/\[(.*?)\]/)?.[1]) || 'ynaq';
                for (const ch of choices.split('')) {
                    if (!ch.trim()) continue;
                    const btn = document.createElement('button');
                    btn.className = 'modal-btn';
                    btn.textContent = `${ch.toUpperCase()} (${ch})`;
                    btn.onclick = () => {
                        clearModal();
                        core.respond(ch);
                    };
                    modalBody.appendChild(btn);
                }
                return;
            }

            // (E) その他のテキスト/コマンドプロンプト
            if (category === 'TEXT' || category === 'FILE' || category === 'EXTCMD' || category === 'KEY' || category === 'OTHER') {
                mobileModal.className = 'mobile-modal active';
                modalTitle.textContent = rawPrompt || '入力してください';

                if (category === 'TEXT' || category === 'FILE' || category === 'EXTCMD') {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.style.cssText = 'background:#000; border:1px solid #00e676; color:#fff; padding:8px; border-radius:4px; font-size:14px;';
                    const btn = document.createElement('button');
                    btn.className = 'modal-btn';
                    btn.textContent = '決定 (Submit)';
                    const submit = () => {
                        const val = input.value || '';
                        clearModal();
                        core.respond(val);
                    };
                    btn.onclick = submit;
                    input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };

                    modalBody.appendChild(input);
                    modalBody.appendChild(btn);
                    setTimeout(() => input.focus(), 50);
                } else {
                    const btn = document.createElement('button');
                    btn.className = 'modal-btn';
                    btn.style.textAlign = 'center';
                    btn.textContent = '次へ進む (Press Space)';
                    btn.onclick = () => {
                        clearModal();
                        core.sendKey('Space');
                    };
                    modalBody.appendChild(btn);
                }
            }
        });

        core.on('inputResolved', () => {
            clearModal();
        });

        // DOM参照
        const logBox = document.getElementById('log-box');
        const zoomCanvas = document.getElementById('nh-zoom-canvas');
        const zoomCtx = zoomCanvas.getContext('2d');
        const radarCanvas = document.getElementById('nh-radar-canvas');
        const radarCtx = radarCanvas.getContext('2d');

        const btnPrimaryAction = document.getElementById('btn-primary-action');
        const primaryKeyBadge = document.getElementById('primary-key-badge');
        const primaryActionLabel = document.getElementById('primary-action-label');
        const subActionsList = document.getElementById('sub-actions-list');

        // ステータス参照
        const stDlvl = document.getElementById('st-dlvl');
        const stHp = document.getElementById('st-hp');
        const stPw = document.getElementById('st-pw');
        const stAc = document.getElementById('st-ac');

        // 状態変数
        let playerX = 10;
        let playerY = 10;
        const VIEW_RADIUS = 5; // 11x11 マス
        const TILE_SIZE = 32;  // 32x32px

        // タイル画像 (フォールバック試行)
        const tileImg = new Image();
        let tileLoaded = false;
        const tilePaths = [
            '../pict/nethack_default_32.png',
            '../assets/nethack_default_32.png',
            'pict/nethack_default_32.png',
            'assets/nethack_default_32.png'
        ];

        function loadNextTileImg(idx) {
            if (idx >= tilePaths.length) return;
            tileImg.onload = () => {
                tileLoaded = true;
                renderZoomCanvas();
            };
            tileImg.onerror = () => loadNextTileImg(idx + 1);
            tileImg.src = tilePaths[idx];
        }
        loadNextTileImg(0);

        // 80x21 全体 Glyph バッファ (初期値: -1 未探査)
        let fullGlyphGrid = Array.from({ length: 21 }, () => new Array(80).fill(-1));

        // マップ・レーダー バッファリセット関数 (階層移動・エリアチェンジ時)
        function clearRadarAndZoomBuffer() {
            fullGlyphGrid = Array.from({ length: 21 }, () => new Array(80).fill(-1));
            renderRadarMinimap();
            renderZoomCanvas();
        }

        core.on('map_cleared', () => clearRadarAndZoomBuffer());
        core.on('clear_nhwindow', ({ windowId }) => {
            if (windowId === 2 || windowId === 0) {
                clearRadarAndZoomBuffer();
            }
        });

        // D-Pad 8方向の安全キーマッピング (number_pad: 1 環境では数字キーを送信してコマンド誤爆を完全防止)
        const DIR_KEY_MAP = {
            'y': { vi: 'y', numpad: '7' },
            'k': { vi: 'k', numpad: '8' },
            'u': { vi: 'u', numpad: '9' },
            'h': { vi: 'h', numpad: '4' },
            'l': { vi: 'l', numpad: '6' },
            'b': { vi: 'b', numpad: '1' },
            'j': { vi: 'j', numpad: '2' },
            'n': { vi: 'n', numpad: '3' },
            '_': { vi: '_', numpad: '_' }
        };

        const dpadGrid = document.getElementById('dpad-grid');
        if (dpadGrid) {
            dpadGrid.addEventListener('click', (e) => {
                const btn = e.target.closest('.dpad-btn');
                if (btn && btn.dataset.dir) {
                    const rawDir = btn.dataset.dir;
                    if (rawDir === '5' || rawDir === '_') {
                        // Look / Travel コマンド (テンキー '5') をダイレクト送信
                        core.sendKey('5');
                        return;
                    }

                    // D-Padの入力は常にシンプルかつ確実な方向キー（移動 / 標準近接攻撃）を安全送信
                    const isNumpadOff = core.options && core.options.number_pad === false;
                    const mappedObj = DIR_KEY_MAP[rawDir];
                    const finalKey = mappedObj ? (isNumpadOff ? mappedObj.vi : mappedObj.numpad) : rawDir;
                    core.sendKey(finalKey);
                }
            });
        }

        // アクション実行関数 (推奨アクションを自動実行)
        window.executeContextAction = function(action) {
            if (!action) return;
            if (action.risk === 'danger') {
                const ok = confirm(`【⚠️ 危険な行動】\n"${action.labelJa || action.label}" を実行しますか？`);
                if (!ok) return;
            }

            if (typeof core.executeAction === 'function') {
                core.executeAction(action);
            } else if (action.extCmd) {
                core.sendExtCommand(action.extCmd, action.directionKey);
            } else if (action.keySequence) {
                core.sendKeySequence(action.keySequence);
            } else if (action.key === 'C-d' || (typeof action.key === 'string' && action.key.startsWith('C-d'))) {
                core.sendKey('d', false, true, false, 'd');
            } else {
                const mainCmd = action.charStr || action.key;
                core.sendKey(mainCmd);
            }
        };

        // 0. ゲームオーバー (gameOver / exited) ハンドラー
        let isGameExited = false;
        let currentGameOverResult = null;

        core.on('gameOver', (result) => {
            currentGameOverResult = result;
        });

        core.on('exited', async (data) => {
            isGameExited = true;
            const result = (data && data.gameOverResult) ? data.gameOverResult : (currentGameOverResult || (core.resolveGameOver ? await core.resolveGameOver() : null));

            mobileModal.className = 'mobile-modal active';
            modalTitle.style.color = '#ff5252';
            modalTitle.textContent = '💀 GAME OVER (ゲーム終了)';
            modalBody.innerHTML = '';

            const deathText = (result && (result.death || result.deathMessage)) ? (result.death || result.deathMessage) : 'Died in dungeon';
            const dlvlText = stDlvl.textContent || '1';

            const summaryDiv = document.createElement('div');
            summaryDiv.style.cssText = 'color:#fff; font-size:13px; display:flex; flex-direction:column; gap:6px; background:#111; padding:10px; border-radius:6px; border:1px solid #ff5252;';
            summaryDiv.innerHTML = `
                <div><b>死因:</b> <span style="color:#ff8a80; font-weight:bold;">${deathText}</span></div>
                <div><b>到達階層:</b> Dungeon Level ${dlvlText}</div>
            `;
            modalBody.appendChild(summaryDiv);

            const btnRestart = document.createElement('button');
            btnRestart.className = 'modal-btn';
            btnRestart.style.cssText = 'background:#00e676; color:#000; font-weight:bold; font-size:14px; text-align:center; padding:10px; margin-top:8px; width:100%; border:none;';
            btnRestart.textContent = '🔄 新しいゲームを開始する (Restart)';
            btnRestart.onclick = () => {
                location.reload();
            };
            modalBody.appendChild(btnRestart);
        });

        // 1. メッセージ更新
        core.on('putstr', ({ text }) => {
            if (!text) return;
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = text;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        });

        // 2. ステータス更新
        core.on('status_updated', (st) => {
            if (!st) return;
            if (st.dlvl !== undefined) stDlvl.textContent = st.dlvl;
            if (st.hp !== undefined) stHp.textContent = `${st.hp} / ${st.hpmax || st.hp}`;
            if (st.pw !== undefined) stPw.textContent = `${st.pw} / ${st.pwmax || st.pw}`;
            if (st.ac !== undefined) stAc.textContent = st.ac;
        });

        // 3. 全体 Glyph 描画受信
        core.on('print_glyph', ({ x, y, glyph }) => {
            if (x >= 0 && x < 80 && y >= 0 && y < 21) {
                fullGlyphGrid[y][x] = glyph;
                renderRadarPixel(x, y, glyph);
            }
        });

        // 4. 自キャラ位置更新
        core.on('cursor', ({ x, y }) => {
            playerX = x;
            playerY = y;
            renderZoomCanvas();
            renderRadarMinimap();
            updateControlDeck();
        });

        core.on('area_updated', () => {
            renderZoomCanvas();
            updateControlDeck();
        });

        // ズーム描画 (自キャラ中心 11x11)
        function renderZoomCanvas() {
            zoomCtx.fillStyle = '#000000';
            zoomCtx.fillRect(0, 0, zoomCanvas.width, zoomCanvas.height);

            const tileMap = typeof tileMapping === 'function' ? tileMapping() : [];
            const cols = tileImg.naturalWidth > 0 ? Math.floor(tileImg.width / 32) : 40;

            for (let ry = -VIEW_RADIUS; ry <= VIEW_RADIUS; ry++) {
                for (let rx = -VIEW_RADIUS; rx <= VIEW_RADIUS; rx++) {
                    const gx = playerX + rx;
                    const gy = playerY + ry;

                    const dx = (rx + VIEW_RADIUS) * TILE_SIZE;
                    const dy = (ry + VIEW_RADIUS) * TILE_SIZE;

                    if (gx >= 0 && gx < 80 && gy >= 0 && gy < 21) {
                        const glyph = fullGlyphGrid[gy][gx];
                        if (tileLoaded && glyph >= 0 && glyph !== 9622) {
                            const tileIndex = tileMap[glyph];
                            if (tileIndex !== undefined) {
                                const sx = (tileIndex % cols) * 32;
                                const sy = Math.floor(tileIndex / cols) * 32;
                                zoomCtx.drawImage(tileImg, sx, sy, 32, 32, dx, dy, TILE_SIZE, TILE_SIZE);
                            } else {
                                zoomCtx.fillStyle = '#000000';
                                zoomCtx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE);
                            }
                        } else {
                            // 未探索領域 ➔ 黒塗りの暗闇
                            zoomCtx.fillStyle = '#000000';
                            zoomCtx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE);
                        }
                    } else {
                        // 範囲外は暗い枠
                        zoomCtx.fillStyle = '#09090b';
                        zoomCtx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE);
                    }

                    // 自キャラ (中央) ハイライト枠
                    if (rx === 0 && ry === 0) {
                        zoomCtx.strokeStyle = '#00e676';
                        zoomCtx.lineWidth = 2;
                        zoomCtx.strokeRect(dx + 1, dy + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                    }
                }
            }
        }

        // 80x21 レーダーミニマップ描画
        function renderRadarMinimap() {
            radarCtx.fillStyle = '#000000';
            radarCtx.fillRect(0, 0, 80, 21);

            for (let y = 0; y < 21; y++) {
                for (let x = 0; x < 80; x++) {
                    renderRadarPixel(x, y, fullGlyphGrid[y][x]);
                }
            }

            // 自キャラ位置を明るい緑ドットで表示
            radarCtx.fillStyle = '#00e676';
            radarCtx.fillRect(playerX, playerY, 1, 1);
        }

        function renderRadarPixel(x, y, glyph) {
            if (glyph < 0 || glyph === 9622) {
                radarCtx.fillStyle = '#000000'; // 未探索 ➔ 黒
                radarCtx.fillRect(x, y, 1, 1);
                return;
            }

            let color = '#2e2e33'; // 床/探索済み
            if (glyph >= 3448 && glyph <= 3928) color = '#ffca28'; // アイテム
            else if (glyph >= 3988 && glyph <= 3989) color = '#ff9800'; // ドア
            else if (glyph >= 3929 && glyph <= 3984) color = '#757575'; // 壁
            else if (glyph < 3448) color = '#ff5252'; // モンスター

            radarCtx.fillStyle = color;
            radarCtx.fillRect(x, y, 1, 1);
        }

        // D-Pad ボタンのビジュアル（色・アイコン）動的ハイライト更新
        function updateDPadVisuals() {
            const areaState = core.getAreaState ? core.getAreaState() : null;
            if (!areaState) return;

            const dpadBtns = document.querySelectorAll('.dpad-btn[data-dir]');
            const originalArrowMap = {
                'y': '↖', 'k': '↑', 'u': '↗',
                'h': '←', '5': 'Wait', '_': 'Wait', 'l': '→',
                'b': '↙', 'j': '↓', 'n': '↘'
            };

            dpadBtns.forEach(btn => {
                const rawDir = btn.dataset.dir;
                if (rawDir === '5' || rawDir === '_') return;

                const resolved = DirectionalActionResolver.resolveDirection(rawDir, areaState, inventoryState);

                if (resolved.isWalkable || !resolved.primaryAction) {
                    // 通常移動キー (デフォルトデザインにリセット)
                    btn.style.background = '#27272a';
                    btn.style.borderColor = '#3f3f46';
                    btn.style.color = '#f4f4f5';
                    btn.style.boxShadow = 'none';
                    btn.textContent = originalArrowMap[rawDir] || rawDir;
                } else {
                    // 移動不可＋スマートアクション割り当て中 ➔ ボタンカラー＆アイコン変更！
                    const act = resolved.primaryAction;
                    let bg = 'linear-gradient(135deg, #1565c0, #0288d1)';
                    let border = '#81d4fa';
                    let icon = '⚡';

                    if (act.id.includes('DOOR')) {
                        bg = 'linear-gradient(135deg, #1b5e20, #2e7d32)';
                        border = '#00e676';
                        icon = '🚪';
                    } else if (act.id.includes('DIG')) {
                        bg = 'linear-gradient(135deg, #4e342e, #6d4c41)';
                        border = '#ffb74d';
                        icon = '⛏️';
                    } else if (act.id.includes('TREE')) {
                        bg = 'linear-gradient(135deg, #33691e, #558b2f)';
                        border = '#aed581';
                        icon = '🪓';
                    } else if (act.id.includes('FREEZE')) {
                        bg = 'linear-gradient(135deg, #01579b, #0288d1)';
                        border = '#81d4fa';
                        icon = '❄️';
                    } else if (act.id.includes('CHAT')) {
                        bg = 'linear-gradient(135deg, #4a148c, #6a1b9a)';
                        border = '#ce93d8';
                        icon = '💬';
                    }

                    btn.style.background = bg;
                    btn.style.borderColor = border;
                    btn.style.color = '#ffffff';
                    btn.style.boxShadow = `0 0 8px ${border}88`;
                    btn.textContent = icon;
                }
            });
        }

        // インベントリ同期状態インジケーター描画
        function renderInventoryStatus() {
            const syncTime = document.getElementById('inv-sync-time');
            const bPick = document.getElementById('badge-pickaxe');
            const bKey = document.getElementById('badge-key');
            const bAxe = document.getElementById('badge-axe');
            const bWand = document.getElementById('badge-wand');

            if (!inventoryState || !syncTime) return;

            if (inventoryState.isSynced) {
                const count = inventoryState.rawItems ? inventoryState.rawItems.length : 0;
                syncTime.textContent = `同期済み (${count}点)`;
                syncTime.style.color = '#00e676';
            } else {
                syncTime.textContent = `未同期 (Press 'i')`;
                syncTime.style.color = '#888';
            }

            // 1. ツルハシ
            const pick = inventoryState.getPickAxe();
            if (pick) {
                bPick.className = 'inv-badge active';
                bPick.textContent = `⛏️ [${pick.letter}] ${pick.rawText || 'ツルハシ'}`;
            } else {
                bPick.className = 'inv-badge disabled';
                bPick.textContent = `⛏️ ツルハシ: なし`;
            }

            // 2. 鍵/ロックピック
            const key = inventoryState.getKeyOrLockPick();
            if (key) {
                bKey.className = 'inv-badge active';
                bKey.textContent = `🔑 [${key.letter}] ${key.rawText || '鍵'}`;
            } else {
                bKey.className = 'inv-badge disabled';
                bKey.textContent = `🔑 鍵/ピック: なし`;
            }

            // 3. 斧
            const axe = inventoryState.getAxe();
            if (axe) {
                bAxe.className = 'inv-badge active';
                bAxe.textContent = `🪓 [${axe.letter}] ${axe.rawText || '斧'}`;
            } else {
                bAxe.className = 'inv-badge disabled';
                bAxe.textContent = `🪓 斧: なし`;
            }

            // 4. 氷の杖
            const wand = inventoryState.getFrostWand();
            if (wand) {
                bWand.className = 'inv-badge active';
                bWand.textContent = `❄️ [${wand.letter}] ${wand.rawText || '氷の杖'}`;
            } else {
                bWand.className = 'inv-badge disabled';
                bWand.textContent = `❄️ 氷の杖: なし`;
            }
        }

        // コントロールデッキ & 巨大プライマリボタン更新
        let currentPrimaryAction = null;

        function updateControlDeck() {
            const areaState = core.getAreaState ? core.getAreaState() : null;
            const actions = areaState ? ContextActionEngine.generateActions(areaState, inventoryState) : (core.getRecommendedActions ? core.getRecommendedActions() : []);
            subActionsList.innerHTML = '';

            // インベントリ同期インジケーター更新
            renderInventoryStatus();

            // D-Pad ボタンの色・アイコンを動的ハイライト
            updateDPadVisuals();

            if (actions && actions.length > 0) {
                // 最優先アクション (actions[0]) を巨大プライマリボタンに割り当て
                currentPrimaryAction = actions[0];
                const keyDisp = currentPrimaryAction.key || (currentPrimaryAction.charStr + (currentPrimaryAction.directionKey || ''));
                primaryKeyBadge.textContent = `[${keyDisp}]`;
                primaryActionLabel.textContent = currentPrimaryAction.labelJa || currentPrimaryAction.label;

                // 2番目以降のアクションをサブリストへ
                const subActions = actions.slice(1);
                subActions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = `sub-action-btn ${action.risk === 'danger' ? 'danger' : ''}`;
                    const kDisp = action.key || (action.charStr + (action.directionKey || ''));
                    const icon = action.target === 'feet' ? '👣 ' : '🧭 ';
                    btn.innerHTML = `<span style="font-family:monospace;">[${kDisp}]</span> <span>${icon}${action.labelJa || action.label}</span>`;
                    btn.onclick = () => window.executeContextAction(action);
                    subActionsList.appendChild(btn);
                });
            } else {
                // デフォルトアクション (探す / 待機)
                currentPrimaryAction = { key: 's', labelJa: '周囲を探す (Search)', risk: null };
                primaryKeyBadge.textContent = '[s]';
                primaryActionLabel.textContent = '周囲を探す (Search)';
                subActionsList.innerHTML = '<span style="color:#666; font-size:10px;">(周辺アクションなし)</span>';
            }
        }

        // プライマリボタンクリック
        btnPrimaryAction.onclick = () => {
            if (currentPrimaryAction) {
                window.executeContextAction(currentPrimaryAction);
            }
        };

        // Core 初期化 & WASM 起動
        async function init() {
            try {
                renderRadarMinimap();
                renderZoomCanvas();
                await core.start('nethack.js');
            } catch (e) {
                console.error("[Mobile PoC] Core start error:", e);
            }
        }

        init();
    </script>
</body>
</html>
