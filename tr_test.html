<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetHack Translation Tester</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0e14;
            --container-bg: rgba(255, 255, 255, 0.05);
            --accent-primary: #7c4dff;
            --accent-secondary: #00e5ff;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-shadow: 0 0 15px rgba(124, 77, 255, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1a1f2b 0%, #0a0e14 100%);
        }

        header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            margin: 0;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 30px;
            gap: 30px;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .pane-title {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-family: 'Inter', monospace;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: var(--neon-shadow);
        }

        #output {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-family: 'Inter', monospace;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .status-bar {
            padding: 10px 40px;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.01);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
        }

        .accent-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-secondary);
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--accent-secondary);
        }

        /* 翻訳された行のハイライト */
        .translated-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <header>
        <h1>NetHack Translation Tester</h1>
        <div style="font-size: 12px; font-weight: 300;">v1.0</div>
    </header>

    <div class="main-container">
        <!-- 左側：入力 -->
        <div class="pane">
            <div class="pane-title">
                <span>Source Text (English)</span>
                <span style="font-size: 10px;">NetHack Messages</span>
            </div>
            <textarea id="input" placeholder="Type or paste NetHack messages here...
Example:
4 uncursed potions of healing
4 uncursed potions of extra healing
a blessed +1 long sword
You see here a scroll of identify."></textarea>
        </div>

        <!-- 右側：出力 -->
        <div class="pane">
            <div class="pane-title">
                <span>Translation Preview (Japanese)</span>
                <span id="stat-count" style="font-size: 10px;">0 lines processed</span>
            </div>
            <div id="output"></div>
        </div>
    </div>

    <div class="status-bar">
        <div><span class="accent-dot"></span>Engine Loaded: trancelate.js</div>
        <div id="debug-info">Ready to test patterns</div>
    </div>

    <!-- Load NetHack Dictionaries -->
    <script src="param/nhMessage.js"></script>

    <!-- Load Translation Engine -->
    <script src="rogue/UI/trancelate.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mock environment for trancelate.js
            const r = {
                define: {
                    LANG_JP: true,
                    LANG_LARNMODE: false,
                    DEBUG_MSG: false
                }
            };

            // Initialize Translator
            let translator;
            try {
                translator = new trancelate(r);
                console.log("Translator initialized successfully");
            } catch (e) {
                console.error("Failed to initialize translator:", e);
                document.getElementById('debug-info').innerText = "ERROR: Failed to load translation engine";
                return;
            }

            const inputArea = document.getElementById('input');
            const outputArea = document.getElementById('output');
            const statCount = document.getElementById('stat-count');

            const performTranslation = () => {
                const text = inputArea.value;
                const lines = text.split('\n');
                let resultHtml = '';

                lines.forEach(line => {
                    if (line.trim() === '') {
                        resultHtml += '\n';
                    } else {
                        const translated = translator.message(line);
                        resultHtml += `<div class="translated-line">${translated}</div>`;
                    }
                });

                outputArea.innerHTML = resultHtml;
                statCount.innerText = `${lines.length} lines processed`;
            };

            // Real-time translation
            inputArea.addEventListener('input', performTranslation);

            // Initial focus and test
            inputArea.focus();

            // Set some default examples if empty
            if (inputArea.value === '') {
                inputArea.value = "4 uncursed potions of healing\n4 uncursed potions of extra healing\na blessed +1 long sword\nYou see here a scroll of identify.";
                performTranslation();
            }
        });
    </script>
</body>

</html>
